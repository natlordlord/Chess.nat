const CURRICULUM = [
 {id: "u1", title: "Chess Foundations", target: "Your first game", desc: "How every piece moves, what check and checkmate mean, and the special rules.", lessons: [
  {id: "u1-board", title: "The Board and the Goal", sub: "Squares, files, ranks and checkmate", steps: [
    {t: "say", fen: START, text: "Welcome to Chess.nat! I'm your coach. Chess is played on a board of <b>64 squares</b>. White always moves first, and the bottom-right square is always light.", marks: {h1: "mark"}},
    {t: "say", fen: START, text: "Columns are called <b>files</b>, named a to h. Rows are called <b>ranks</b>, numbered 1 to 8. So every square has a name, like <b>e4</b>.", marks: {e4: "mark"}, arrows: [["e1","e8","b"],["a4","h4","y"]]},
    {t: "say", fen: START, text: "The goal is <b>checkmate</b>: attack the enemy king so that it cannot escape. You never actually capture the king. Once it's trapped, the game is over.", fact: "The word checkmate comes from the Persian 'shah mat', which means 'the king is helpless'."},
    {t: "quiz", fen: START, text: "Quick check.", q: "", options: ["The square in the bottom-right corner is dark", "The square in the bottom-right corner is light", "It depends on the board"], a: 1, explain: "Light on the right! If yours is dark, turn the board."},
    {t: "quiz", fen: START, marks: {e4: "mark"}, text: "What is the name of the highlighted square?", options: ["d4", "e4", "e5", "4e"], a: 1, explain: "File first (e), then rank (4)."}
  ]},
  {id: "u1-rook", title: "The Rook", sub: "Straight lines, any distance", steps: [
    {t: "say", fen: "8/8/8/8/3R4/8/8/8 w - - 0 1", text: "The <b>rook</b> moves in straight lines: up, down, left or right, as far as it likes. It cannot jump over pieces.", arrows: [["d4","d8","g"],["d4","d1","g"],["d4","a4","g"],["d4","h4","g"]]},
    {t: "say", fen: "8/8/8/8/3R4/8/8/8 w - - 0 1", text: "A rook is worth about <b>5 points</b>. Rooks are strongest on open files where nothing blocks them."},
    {t: "collect", fen: "7k/8/8/p3p3/8/8/4p3/R5K1 w - - 0 1", piece: "r", par: 3, text: "Your turn. Capture all the black pawns with the rook. Try to do it in 3 moves."},
    {t: "collect", fen: "7k/8/1p4p1/8/8/1p4p1/8/R6K w - - 0 1", piece: "r", par: 5, text: "Now four pawns. Plan your route before you move."}
  ]},
  {id: "u1-bishop", title: "The Bishop", sub: "Diagonals only", steps: [
    {t: "say", fen: "8/8/8/8/3B4/8/8/8 w - - 0 1", text: "The <b>bishop</b> moves diagonally, any distance. A bishop stays on its colour for the whole game: you have one light-squared and one dark-squared bishop.", arrows: [["d4","a7","g"],["d4","h8","g"],["d4","a1","g"],["d4","g1","g"]]},
    {t: "say", fen: "8/8/8/8/3B4/8/8/8 w - - 0 1", text: "A bishop is worth about <b>3 points</b>, the same as a knight."},
    {t: "collect", fen: "k2p4/8/8/6p1/8/4p3/8/2B4K w - - 0 1", piece: "b", par: 3, text: "Collect all pawns with the bishop in 3 moves."},
    {t: "quiz", fen: "8/8/8/8/3B4/8/8/8 w - - 0 1", text: "Can this bishop ever reach the square d5?", options: ["Yes, in two moves", "No, d5 is a light square and this bishop lives on dark squares", "Yes, in one move"], a: 1, explain: "d4 is dark, d5 is light. Bishops never change colour."}
  ]},
  {id: "u1-queen", title: "The Queen", sub: "Rook plus bishop", steps: [
    {t: "say", fen: "8/8/8/8/3Q4/8/8/8 w - - 0 1", text: "The <b>queen</b> combines the rook and the bishop: straight lines and diagonals, any distance. She's the strongest piece, worth about <b>9 points</b>.", arrows: [["d4","d8","g"],["d4","h8","g"],["d4","h4","g"],["d4","g1","g"],["d4","d1","g"],["d4","a1","g"],["d4","a4","g"],["d4","a7","g"]]},
    {t: "collect", fen: "k7/8/3p3p/8/8/4p3/8/K2Q4 w - - 0 1", piece: "q", par: 3, text: "Collect the pawns with your queen in 3 moves."},
    {t: "say", fen: "8/8/8/8/3Q4/8/8/8 w - - 0 1", text: "Because she's so valuable, don't bring the queen out too early. Weaker pieces can chase her around and you lose time.", fact: "The queen only became this powerful around 1475 in Spain. Before that she could move just one square diagonally."}
  ]},
  {id: "u1-king", title: "The King", sub: "One step at a time", steps: [
    {t: "say", fen: "8/8/8/8/3K4/8/8/8 w - - 0 1", text: "The <b>king</b> moves one square in any direction. It can never move onto a square that is attacked by the enemy.", marks: {c3:"mark",c4:"mark",c5:"mark",d3:"mark",d5:"mark",e3:"mark",e4:"mark",e5:"mark"}},
    {t: "collect", fen: "k7/8/8/8/6p1/4p3/8/4K3 w - - 0 1", piece: "k", par: 4, text: "Use your king to collect the pawns. Careful: a king can't step onto a square a pawn attacks."},
    {t: "say", fen: "8/8/8/8/3K4/8/8/8 w - - 0 1", text: "In the opening and middlegame, keep your king safe. In the endgame, when the queens are gone, the king becomes a strong fighting piece."}
  ]},
  {id: "u1-knight", title: "The Knight", sub: "The L-shaped jumper", steps: [
    {t: "say", fen: "8/8/8/8/3N4/8/8/8 w - - 0 1", text: "The <b>knight</b> moves in an L: two squares one way and one square to the side. It's the only piece that can <b>jump over</b> other pieces.", marks: {b3:"mark",b5:"mark",c2:"mark",c6:"mark",e2:"mark",e6:"mark",f3:"mark",f5:"mark"}},
    {t: "say", fen: "8/8/8/8/3N4/8/8/8 w - - 0 1", text: "Trick: a knight always lands on the opposite colour from where it started. Knights are worth about <b>3 points</b> and love central squares."},
    {t: "collect", fen: "k7/8/5p2/8/4p3/2p5/8/1N5K w - - 0 1", piece: "n", par: 3, text: "Collect the pawns with the knight in 3 moves."},
    {t: "collect", fen: "k7/8/8/3p4/8/1p6/8/N6K w - - 0 1", piece: "n", par: 5, text: "Knights are slow over long distances. Reach both pawns."}
  ]},
  {id: "u1-pawn", title: "The Pawn", sub: "Small but mighty", steps: [
    {t: "say", fen: "8/8/8/8/8/8/4P3/8 w - - 0 1", text: "<b>Pawns</b> move straight forward one square. On their very first move they may move two squares. They are worth <b>1 point</b>.", arrows: [["e2","e4","g"]]},
    {t: "say", fen: "8/8/8/3p1p2/4P3/8/8/8 w - - 0 1", text: "Pawns <b>capture diagonally</b>, one square forward. A pawn can't capture straight ahead and can't move backwards.", arrows: [["e4","d5","r"],["e4","f5","r"]]},
    {t: "collect", fen: "k7/8/8/4p3/8/3p4/4P3/7K w - - 0 1", piece: "p", par: 3, text: "Use the pawn to collect the black pawns."},
    {t: "say", fen: "8/4P3/8/8/8/8/8/8 w - - 0 1", text: "When a pawn reaches the last rank it <b>promotes</b>: it turns into a queen, rook, bishop or knight. Almost always you choose a queen."},
    {t: "drill", fen: "k7/4P3/8/8/8/8/8/7K w - - 0 1", accept: {promote: true}, text: "Promote the pawn!", okText: "A brand new queen."}
  ]},
  {id: "u1-check", title: "Check and Checkmate", sub: "Attack the king", steps: [
    {t: "say", fen: "4k3/8/8/8/8/8/8/R3K3 w - - 0 1", demo: ["a1a8"], text: "When the king is attacked, it is in <b>check</b>. The player in check must get out of check right away."},
    {t: "say", fen: "R3k3/8/8/8/8/8/8/4K3 b - - 0 1", orient: "w", text: "There are three ways out of check: <b>move</b> the king, <b>block</b> the attack, or <b>capture</b> the attacker."},
    {t: "drill", fen: "6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1", accept: {mate: true}, text: "If there is no way out, it's <b>checkmate</b>. Find the checkmate in one move.", hint: "The black king is boxed in by its own pawns. Attack the back rank.", okText: "Checkmate! This pattern is called a back-rank mate."},
    {t: "drill", fen: "k7/8/1K6/8/8/8/7Q/8 w - - 0 1", accept: {mate: true}, text: "Another one. Checkmate in one.", hint: "Your king covers a7 and b7. Use the queen on the back rank.", okText: "Checkmate!"},
    {t: "puzzles", theme: "mateIn1", n: 3, range: [400, 900], text: "Now some real puzzles from games: find mate in one."}
  ]},
  {id: "u1-special", title: "Castling and En Passant", sub: "The special moves", steps: [
    {t: "say", fen: "r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1", demo: ["e1g1"], text: "<b>Castling</b> moves the king two squares toward a rook, and the rook jumps to the other side of the king. It tucks your king away and brings the rook into play."},
    {t: "say", fen: "r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1", text: "You may castle only if: the king and that rook haven't moved, nothing is between them, the king is not in check, and the king doesn't pass through or land on an attacked square."},
    {t: "drill", fen: "r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1", accept: {castle: true}, text: "Castle! Drag your king two squares to either side.", hint: "Move the king from e1 to g1 or c1.", okText: "Your king is safe now."},
    {t: "say", fen: "k7/8/8/3pP3/8/8/8/7K w - d6 0 1", last: {from: "d7", to: "d5"}, text: "<b>En passant</b>: if an enemy pawn moves two squares and lands right next to your pawn, you can capture it as if it had moved only one. You must do it immediately.", arrows: [["e5","d6","g"]]},
    {t: "drill", fen: "k7/8/8/3pP3/8/8/8/7K w - d6 0 1", last: {from: "d7", to: "d5"}, accept: {uci: ["e5d6"]}, text: "Black just played d7-d5. Capture en passant!", hint: "Move your e5 pawn diagonally to d6.", okText: "En passant! The d5 pawn disappears."}
  ]},
  {id: "u1-draws", title: "Draws and Stalemate", sub: "When nobody wins", steps: [
    {t: "say", fen: "7k/5Q2/6K1/8/8/8/8/8 b - - 0 1", orient: "w", text: "<b>Stalemate</b>: it's your turn, you are NOT in check, but you have no legal move. That's a draw! Here Black is to move and can't move anywhere."},
    {t: "quiz", fen: "7k/5Q2/6K1/8/8/8/8/8 b - - 0 1", text: "Black to move. What is this?", options: ["Checkmate, White wins", "Stalemate, it's a draw", "Black is in check"], a: 1, explain: "The king isn't attacked, but every square around it is. Stalemate."},
    {t: "say", fen: "8/8/8/8/8/2k5/8/2K5 w - - 0 1", text: "Other draws: <b>insufficient material</b> (like king against king), <b>threefold repetition</b> (the same position three times), the <b>50-move rule</b>, or simply agreeing to a draw.", fact: "Stalemate is the most common way to throw away a won game. When you are winning, always leave the enemy king a square."}
  ]}
 ]},
 {id: "u2", title: "Winning Material", target: "400 → 600", desc: "Piece values, free pieces, and safe captures. Most beginner games are decided right here.", lessons: [
  {id: "u2-values", title: "What Pieces Are Worth", sub: "1 · 3 · 3 · 5 · 9", steps: [
    {t: "say", fen: START, text: "Pawn <b>1</b>, knight <b>3</b>, bishop <b>3</b>, rook <b>5</b>, queen <b>9</b>. The king is priceless. Use these numbers to judge every trade."},
    {t: "quiz", fen: START, text: "You can trade your bishop for the opponent's rook. Good deal?", options: ["Yes, I win 2 points", "No, I lose 2 points", "It's even"], a: 0, explain: "Bishop 3, rook 5. Winning a rook for a minor piece is called winning the exchange."},
    {t: "quiz", fen: START, text: "Two knights or one rook plus one pawn?", options: ["Two knights (6 points)", "Rook and pawn (6 points)", "Roughly equal"], a: 2, explain: "Both add up to 6. In the middlegame, two pieces are often a bit better than a rook and pawn."}
  ]},
  {id: "u2-hanging", title: "Hanging Pieces", sub: "Take what's free", steps: [
    {t: "say", fen: "4k3/8/8/3n4/8/8/8/3QK3 w - - 0 1", text: "A piece is <b>hanging</b> when it's attacked and not defended. Before every move, ask: is anything of my opponent's hanging? Is anything of mine hanging?", arrows: [["d1","d5","r"]]},
    {t: "drill", fen: "4k3/8/8/3n4/8/8/8/3QK3 w - - 0 1", accept: {uci: ["d1d5"]}, text: "Black's knight is undefended. Take it.", okText: "Free piece. +3."},
    {t: "drill", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/8/PPP2PPP/RNBQKBNR b KQkq - 0 3", accept: {uci: ["e5d4","c6d4"]}, text: "Black to move. White just pushed d4. Win a pawn.", hint: "The d4 pawn is attacked twice and defended once.", okText: "A free central pawn."},
    {t: "puzzles", theme: "hangingPiece", n: 4, range: [400, 1000], text: "Real puzzles: something is hanging. Find it."},
    {t: "game", fen: START, bot: "nova", goal: "win", limit: 80, text: "Practice game against Nova. She leaves pieces hanging all the time. Take them, then checkmate her.", okText: "You won your first game!"}
  ]},
  {id: "u2-defenders", title: "Attackers and Defenders", sub: "Count before you capture", steps: [
    {t: "say", fen: "4k3/8/3p4/4p3/8/8/4R3/4K3 w - - 0 1", text: "Capturing a defended piece starts a <b>trade</b>. Count attackers and defenders. If you have more attackers, you usually win the piece. Here the e5 pawn is defended by d6: taking it with the rook loses the rook.", arrows: [["e2","e5","r"],["d6","e5","b"]]},
    {t: "quiz", fen: "4k3/8/3p4/4p3/8/8/4R3/4K3 w - - 0 1", text: "Should White play Rxe5?", options: ["Yes, it wins a pawn", "No, dxe5 wins my rook for a pawn"], a: 1, explain: "Rook (5) for pawn (1) is a terrible trade."},
    {t: "say", fen: START, text: "Your new habit before every move: <b>Checks, Captures, Threats</b>. First for your opponent (what does their last move threaten?), then for you."},
    {t: "puzzles", n: 4, range: [500, 1000], text: "Mixed puzzles. Look at every check and capture."}
  ]},
  {id: "u2-ahead", title: "Winning When You're Ahead", sub: "Trade pieces, not pawns", steps: [
    {t: "say", fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", text: "You're a whole rook up. Now what? <b>Trade pieces</b> (not pawns), keep your king safe, create a passed pawn, and look for checkmate. Every trade makes your extra material count more."},
    {t: "quiz", fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", text: "You're ahead in material. Which trade helps you most?", options: ["Trading queens", "Trading pawns", "Avoiding all trades"], a: 0, explain: "Trading pieces, especially queens, removes your opponent's counterplay."},
    {t: "game", fen: "6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", goal: "mate", limit: 60, depth: 6, text: "Convert it: checkmate within 60 moves. The engine defends.", okText: "Converted! Winning a won position is a real skill."}
  ]}
 ]},
 {id: "u3", title: "Checkmate Patterns", target: "600 → 800", desc: "The mates every player must know, plus the classic traps.", lessons: [
  {id: "u3-queen", title: "Queen and King Mate", sub: "Box in the king", steps: [
    {t: "say", fen: "8/8/8/4k3/8/8/8/1Q2K3 w - - 0 1", text: "With king and queen against a lone king, you always win. Technique: use the queen to <b>shrink the box</b> around the enemy king, a knight's move away. Then bring your king closer and mate on the edge."},
    {t: "say", fen: "7k/4Q3/6K1/8/8/8/8/8 w - - 0 1", text: "Final picture: the enemy king is on the edge, your king supports the queen. <b>Danger</b>: never take away the last free square without giving check. That is stalemate.", arrows: [["e7","g7","g"]]},
    {t: "game", fen: "8/8/8/4k3/8/8/8/1Q2K3 w - - 0 1", goal: "mate", limit: 25, depth: 8, text: "Checkmate the lone king within 25 moves. The engine defends perfectly.", okText: "Checkmate! You'll use this many times."}
  ]},
  {id: "u3-ladder", title: "The Ladder Mate", sub: "Two rooks", steps: [
    {t: "say", fen: "8/8/3k4/8/8/8/8/R3K2R w - - 0 1", demo: ["a1a5","d6e6","h1h6","e6d7","a5a7","d7c8","h6h8"], speed: 1000, text: "Two rooks (or queen and rook) walk the king to the edge like a ladder. One rook cuts off a rank, the other gives check on the next rank."},
    {t: "game", fen: "8/8/3k4/8/8/8/8/R3K2R w - - 0 1", goal: "mate", limit: 12, depth: 8, text: "Your turn: mate with the two rooks within 12 moves. If the king attacks a rook, move it far away on the same rank.", okText: "Ladder complete!"}
  ]},
  {id: "u3-rook", title: "Rook and King Mate", sub: "Patience and opposition", steps: [
    {t: "say", fen: "8/8/8/4k3/8/8/8/R3K3 w - - 0 1", text: "King and rook can also force mate, but the king must help more. Cut the enemy king off with the rook, walk your king up, and when the kings face each other, check from the side."},
    {t: "say", fen: "4k3/8/4K3/8/8/8/8/R7 w - - 0 1", arrows: [["a1","a8","g"]], text: "The final position: kings face each other (that's called <b>opposition</b>) and the rook checks along the edge."},
    {t: "game", fen: "8/8/8/4k3/8/8/8/R3K3 w - - 0 1", goal: "mate", limit: 35, depth: 8, text: "Mate with king and rook within 35 moves.", okText: "Excellent technique!"}
  ]},
  {id: "u3-backrank", title: "Back-Rank Mate", sub: "Trapped by its own pawns", steps: [
    {t: "say", fen: "3r2k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1", text: "A king behind three unmoved pawns can be mated by a rook or queen on the back rank. Defenders: make <b>luft</b> (an escape square) by pushing a pawn like h3."},
    {t: "line", fen: "3r2k1/5ppp/8/8/8/8/1Q3PPP/3R2K1 w - - 0 1", line: ["d1d8"], text: "White to move. Win with a back-rank idea.", hint: "Black's rook is the only defender of the back rank. Trade it off.", okText: "Rxd8 is checkmate. The black rook can't defend because... it's gone!"},
    {t: "puzzles", theme: "backRankMate", n: 4, range: [500, 1200], text: "Back-rank puzzles from real games."},
    {t: "story", ...STORIES.opera, text: "The most famous back-rank mate ever: Paul Morphy's Opera Game. Press play."}
  ]},
  {id: "u3-scholar", title: "Scholar's Mate and Early Traps", sub: "Attack f7, defend f7", steps: [
    {t: "say", fen: START, demo: ["e2e4","e7e5","f1c4","b8c6","d1h5","g8f6","h5f7"], text: "The <b>Scholar's Mate</b>: queen and bishop both aim at f7, the weakest square in Black's camp because only the king defends it."},
    {t: "drill", fen: "r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3", orient: "b", accept: {uci: ["g7g6","d8e7","d8f6","g8h6"]}, text: "You're Black. White threatens Qxf7 mate. Defend!", hint: "Block the queen with a pawn, or defend f7 with your queen.", okText: "Safe. Now White's queen is exposed and you can chase it with your pieces."},
    {t: "puzzles", theme: "earlyMate", n: 3, range: [400, 1200], text: "Early checkmates from real games."},
    {t: "story", ...STORIES.legal, text: "A famous trap from 1750: Légal's Mate."}
  ]}
 ]},
 {id: "u4", title: "Tactics I", target: "800 → 1000", desc: "The four basic weapons: forks, pins, skewers and discovered attacks.", lessons: [
  {id: "u4-fork", title: "Forks", sub: "Attack two things at once", steps: [
    {t: "say", fen: "r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1", arrows: [["d5","c7","g"]], text: "A <b>fork</b> attacks two pieces at once. The opponent can only save one. Knights are the best forkers because they attack in a funny shape."},
    {t: "drill", fen: "r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1", accept: {uci: ["d5c7"]}, text: "Find the knight fork.", hint: "Which square attacks both the king and the rook?", okText: "Check and attack on the rook. Next move you take it."},
    {t: "drill", fen: "6k1/5ppp/8/2r1q3/8/8/5PPP/1Q4K1 w - - 0 1", accept: {uci: ["b1b8"]}, text: "Queens are great at double attacks. Find the strongest check.", hint: "Black's back rank is weak.", okText: "Qb8+! Black must block with Qe8, and Qxe8 is checkmate."},
    {t: "puzzles", theme: "fork", n: 5, range: [600, 1200], text: "Fork puzzles."},
    {t: "game", fen: START, bot: "pip", goal: "win", limit: 120, text: "Practice game against Pip. Pip grabs things greedily and walks into forks. Look for double attacks.", okText: "Victory!"}
  ]},
  {id: "u4-pin", title: "Pins", sub: "It can't move", steps: [
    {t: "say", fen: "4k3/8/2n5/8/B7/8/8/4K3 w - - 0 1", arrows: [["a4","e8","r"]], text: "A <b>pin</b>: a piece can't move because a more valuable piece stands behind it. If the piece behind is the king, the pin is <b>absolute</b>: moving is illegal."},
    {t: "drill", fen: "4k3/3q4/8/8/8/8/8/3BK2R w - - 0 1", accept: {uci: ["d1a4"]}, text: "Find the bishop move that pins Black's queen to the king.", hint: "Line up the bishop with the queen and the king on one diagonal.", okText: "The queen can't move off that diagonal. You'll win it for a bishop."},
    {t: "puzzles", theme: "pin", n: 5, range: [600, 1300], text: "Pin puzzles."}
  ]},
  {id: "u4-skewer", title: "Skewers", sub: "A pin in reverse", steps: [
    {t: "say", fen: "8/8/2k5/8/4q3/8/8/R3K3 w - - 0 1", text: "A <b>skewer</b> attacks a valuable piece; when it moves away, you capture the piece behind it."},
    {t: "drill", fen: "q7/8/2k5/8/8/8/8/3BK3 w - - 0 1", accept: {uci: ["d1f3"]}, text: "Skewer the king and queen.", hint: "Give check on the long diagonal.", okText: "The king must step aside, and the bishop takes the queen."},
    {t: "puzzles", theme: "skewer", n: 4, range: [700, 1300], text: "Skewer puzzles."}
  ]},
  {id: "u4-discovered", title: "Discovered Attacks", sub: "Move one, attack with another", steps: [
    {t: "say", fen: "4k3/8/8/4N3/8/8/8/4R1K1 w - - 0 1", arrows: [["e1","e8","r"]], text: "A <b>discovered attack</b>: you move a piece out of the way and reveal an attack by the piece behind it. If both pieces give check, it's a <b>double check</b>, and the king must move."},
    {t: "drill", fen: "4k3/8/3q4/4N3/8/8/8/4R1K1 w - - 0 1", accept: {uci: ["e5f7","e5c4"]}, text: "Discovered check! Move the knight so the rook gives check, and attack the queen at the same time.", hint: "Which knight squares attack d6?", okText: "Black must deal with the check, and next you take the queen."},
    {t: "story", ...STORIES.reti, text: "The most famous double check: Réti vs Tartakower, 1910."},
    {t: "puzzles", theme: "discoveredAttack", n: 4, range: [700, 1300], text: "Discovered attack puzzles."}
  ]}
 ]},
 {id: "u5", title: "Opening Principles", target: "Your first games", desc: "How to start a game well, before you play your first full games.", lessons: [
  {id: "u5-principles", title: "The Three Golden Rules", sub: "Center, develop, castle", steps: [
    {t: "say", fen: START, demo: ["e2e4","e7e5","g1f3","b8c6","f1c4","f8c5","e1g1"], text: "Rule 1: fight for the <b>center</b> with pawns. Rule 2: <b>develop</b> knights and bishops quickly. Rule 3: <b>castle</b> early to protect your king."},
    {t: "say", fen: START, text: "Avoid: moving the same piece twice, bringing the queen out early, and grabbing pawns on the edge while your pieces sleep."},
    {t: "drill", fen: "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", text: "White to move. Play the best developing move on the board.", accept: {uci: ["g1f3"]},
      why: {b1c3: {ok: true, text: "That develops a piece, nice! But there's a knight move that also attacks the pawn on e5."}, f1c4: {ok: true, text: "A good developing move! But there's a knight move that also attacks the pawn on e5."}, f1b5: {ok: true, text: "It develops, but there's a knight move that also attacks the pawn on e5."}, d1h5: "Bringing the queen out this early lets Black chase her around while developing.", d1f3: "Bringing the queen out this early lets Black chase her around while developing.", d1g4: "Bringing the queen out this early lets Black chase her around while developing.", e1e2: "Never walk your king into the center. It needs to castle.", a2a4: "An edge pawn move doesn't develop anything.", h2h4: "An edge pawn move doesn't develop anything."},
      hint: "Which knight can jump forward and attack the pawn on e5?", hintSq: "g1", okTitle: "Perfect!", okText: "The knight develops and attacks the e5 pawn at the same time."},
    {t: "game", fen: START, bot: "bruno", goal: "win", limit: 150, text: "Your first real game! Bruno brings his queen out early. Develop your pieces, castle, and take anything he leaves hanging. Use the threat helper if you need it.", okText: "Development wins!"}
  ]},
  {id: "u5-italian", title: "The Italian Game", sub: "1.e4 e5 2.Nf3 Nc6 3.Bc4", steps: [
    {t: "say", fen: START, demo: ["e2e4","e7e5","g1f3","b8c6","f1c4"], text: "The <b>Italian Game</b> is one of the oldest openings. White develops quickly and aims the bishop at f7.", fact: "It was analyzed by the Italian Gioachino Greco around 1620. His games are still studied today."},
    {t: "say", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3", demo: ["f8c5","c2c3","g8f6","d2d4"], text: "Main plan: c3 and d4 to build a big center."},
    {t: "drill", fen: "r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3", accept: {uci: ["f1c4"]}, text: "Play the Italian Game's key move.", okText: "Bc4! Aiming at f7."},
    {t: "puzzles", theme: "opening", n: 3, range: [500, 1000], text: "Opening tactics."}
  ]},
  {id: "u5-qgd", title: "The Queen's Gambit", sub: "1.d4 d5 2.c4", steps: [
    {t: "say", fen: START, demo: ["d2d4","d7d5","c2c4","e7e6","b1c3","g8f6","c1g5"], text: "With <b>1.d4</b>, the <b>Queen's Gambit</b> offers a pawn to pull Black's d-pawn away from the center. Black can decline with e6 or c6."},
    {t: "say", fen: START, demo: ["d2d4","d7d5","c2c4","d5c4","e2e3","b7b5","a2a4","c7c6","a4b5","c6b5","d1f3"], text: "If Black accepts and tries to hold the extra pawn with ...b5, White wins it back with a4 and a fork on the long diagonal."},
    {t: "drill", fen: "rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2", accept: {uci: ["c2c4"]}, text: "Play the Queen's Gambit.", okText: "That's it."}
  ]},
  {id: "u5-black", title: "Your Answers as Black", sub: "Against 1.e4 and 1.d4", steps: [
    {t: "say", fen: START, demo: ["e2e4","e7e5"], text: "Against <b>1.e4</b>, the simplest answer is <b>1...e5</b>: a central pawn and open lines for your pieces."},
    {t: "say", fen: START, demo: ["e2e4","c7c6","d2d4","d7d5"], text: "The <b>Caro-Kann</b> (1...c6 then ...d5) is solid and safe. Great when you want calm games."},
    {t: "say", fen: START, demo: ["d2d4","d7d5","c2c4","e7e6"], text: "Against <b>1.d4</b>, play <b>1...d5</b> and support it with ...e6 or ...c6."},
    {t: "game", fen: START, user: "b", bot: "pip", goal: "win", limit: 150, text: "Now play Black against Pip. Answer e4 with e5, or d4 with d5, and develop.", okText: "Great win with Black!"}
  ]},
  {id: "u5-traps", title: "Classic Opening Traps", sub: "Fall for none of them", steps: [
    {t: "say", fen: START, demo: ["f2f3","e7e5","g2g4","d8h4"], text: "<b>Fool's Mate</b>, the fastest checkmate: mate in 2. Weakening your king with f3 and g4 is deadly."},
    {t: "say", fen: START, demo: ["e2e4","e7e5","g1f3","b8c6","f1c4","g8f6","f3g5","d7d5","e4d5","f6d5","g5f7"], text: "The <b>Fried Liver</b> idea: White sacrifices a knight on f7 to drag the king out. Against Ng5, Black should play ...d5 and after exd5 respond with ...Na5, not ...Nxd5."},
    {t: "puzzles", theme: "attackingF2F7", n: 4, range: [400, 1000], text: "Attacks on f2 and f7."}
  ]}
 ]},
 {id: "u5b", title: "Your Opening Repertoire", target: "1000 → 1200", desc: "One plan for White, one defence against 1.e4 and one against 1.d4. Play each line until you know it by heart.", lessons: [
  {id: "rep-italian", title: "Italian Game: Giuoco Piano", sub: "Your main weapon with White", steps: [
    {t: "say", fen: START, demo: ["e2e4","e7e5","g1f3","b8c6","f1c4","f8c5"], text: "With White you'll play <b>1.e4</b> and the <b>Italian Game</b>. Quick development, pressure on f7, and a plan to build a big pawn center with c3 and d4.", fact: "Giuoco Piano is Italian for 'quiet game', although the main lines are anything but quiet."},
    {t: "line", fen: START, user: "w", opening: "Italian Game", san: "e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5 exd5 Nxd5 Qb3 Nce7 O-O O-O",
      notes: {0: "Take the center.", 2: "Develop and attack e5.", 4: "The bishop aims at f7.", 6: "Prepare d4.", 8: "Strike in the center.", 10: "Now you have two central pawns.", 12: "Block the check and offer a trade.", 14: "Recapture with a developing move.", 16: "Trade in the center to open lines.", 18: "Hit d5 and b7 at once.", 20: "Castle. Your king is safe and your rooks connect."},
      text: "Play the White moves. I'll answer for Black and explain as we go.", okText: "That's the main line. You have active pieces and an easy game."},
    {t: "line", fen: START, user: "w", opening: "Italian Game, from memory", san: "e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Bd2 Bxd2+ Nbxd2 d5 exd5 Nxd5 Qb3 Nce7 O-O O-O", text: "Same line again, no comments. Can you play it from memory?", okText: "Memorised!"},
    {t: "game", fen: "r1bq1rk1/ppp1nppp/8/3n4/2BP4/1Q3N2/PP1N1PPP/R4RK1 w - - 4 12", bot: "lia", goal: "win", limit: 150, text: "Play on from the final position against Lia. Use your lead in development.", okText: "Opening knowledge turned into a win!"}
  ]},
  {id: "rep-twoknights", title: "Italian Game: Two Knights", sub: "When Black plays 3...Nf6", steps: [
    {t: "say", fen: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4", text: "If Black plays <b>3...Nf6</b>, your e4 pawn is attacked. Keep it simple: protect it with <b>d3</b>, castle, and build slowly. This is the Giuoco Pianissimo, very popular among strong players today."},
    {t: "line", fen: START, user: "w", opening: "Giuoco Pianissimo", san: "e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Be7 O-O O-O Re1 d6 c3 Na5 Bb5 a6 Ba4 b5 Bc2",
      notes: {6: "Protect e4 calmly.", 8: "King to safety.", 10: "The rook supports e4 and a future d4.", 12: "A retreat square for the bishop and support for d4.", 14: "The knight hit your bishop. Keep it on the diagonal...", 18: "...and tuck it on c2, still aiming at the kingside."},
      text: "Play White against the Two Knights.", okText: "A calm, solid setup. Next comes Nbd2-f1-g3 and a slow kingside attack."}
  ]},
  {id: "rep-london", title: "London System", sub: "A simple system with 1.d4", steps: [
    {t: "say", fen: START, demo: ["d2d4","d7d5","c1f4","g8f6","e2e3","e7e6"], text: "Want something with fewer forcing lines? The <b>London System</b>: d4, Bf4, e3, Nf3, c3, Nbd2, Bd3. The same setup against almost anything."},
    {t: "line", fen: START, user: "w", opening: "London System", san: "d4 d5 Bf4 Nf6 e3 e6 Nf3 c5 c3 Nc6 Nbd2 Bd6 Bg3 O-O Bd3 b6 Ne5",
      notes: {2: "The bishop comes out before e3 locks it in.", 8: "A solid pyramid.", 12: "Keep the bishop instead of trading it.", 14: "Aim at the kingside.", 16: "The knight jumps to e5. Next: f4 and a kingside attack."},
      text: "Build the London setup.", okText: "That's the London. Easy to learn, hard to beat."}
  ]},
  {id: "rep-alapin", title: "Facing the Sicilian", sub: "The Alapin: 2.c3", steps: [
    {t: "say", fen: "rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", text: "Many players answer 1.e4 with the <b>Sicilian, 1...c5</b>. Instead of learning huge amounts of theory, play <b>2.c3</b> (the Alapin) and build your center with d4."},
    {t: "line", fen: START, user: "w", opening: "Sicilian, Alapin", san: "e4 c5 c3 Nf6 e5 Nd5 d4 cxd4 Nf3 Nc6 cxd4 d6 Bc4 Nb6 Bb5",
      notes: {2: "Prepare d4.", 4: "Gain space and chase the knight.", 6: "Claim the center.", 10: "Now you have a big pawn center.", 12: "Hit the knight on d5.", 14: "Pin the knight. Your pieces are active."},
      text: "Play White against the Sicilian.", okText: "A comfortable position without memorising pages of theory."}
  ]},
  {id: "rep-caro-adv", title: "Caro-Kann: Advance", sub: "Your defence against 1.e4", steps: [
    {t: "say", fen: "rnbqkbnr/pp1ppppp/2p5/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", orient: "b", text: "As Black against <b>1.e4</b> you'll play the <b>Caro-Kann: 1...c6</b> followed by ...d5. It's solid, and your light-squared bishop gets outside the pawn chain before you play ...e6.", fact: "World Champions Anatoly Karpov and Magnus Carlsen have both relied on the Caro-Kann."},
    {t: "line", fen: START, user: "b", orient: "b", opening: "Caro-Kann, Advance", san: "e4 c6 d4 d5 e5 Bf5 Nf3 e6 Be2 c5 O-O Nc6 c3 cxd4 cxd4 Nge7",
      notes: {1: "Prepare ...d5.", 3: "Challenge the center.", 5: "Develop the bishop before ...e6 locks it in.", 7: "A solid pawn chain.", 9: "Attack the base of White's chain!", 11: "Add pressure on d4.", 13: "Open the c-file.", 15: "The knight heads to f5 to hit d4 again."},
      text: "You're Black. Play the Caro-Kann against the Advance Variation.", okText: "Good. You pressure d4 and have no weaknesses."}
  ]},
  {id: "rep-caro-classical", title: "Caro-Kann: Classical", sub: "When White plays 3.Nc3", steps: [
    {t: "line", fen: START, user: "b", orient: "b", opening: "Caro-Kann, Classical", san: "e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6 Nf3 Nd7 h5 Bh7 Bd3 Bxd3 Qxd3 e6",
      notes: {5: "Take on e4.", 7: "Develop with tempo on the knight.", 9: "Keep the bishop on the diagonal.", 11: "Give the bishop a retreat square.", 13: "Develop and prepare ...Ngf6.", 15: "The bishop stays alive.", 17: "Trade off White's best attacking piece.", 19: "Solid as a rock. Next ...Ngf6, ...Be7 and castle."},
      text: "Play Black in the Classical Caro-Kann.", okText: "This structure is one of the most solid in chess."}
  ]},
  {id: "rep-qgd", title: "Queen's Gambit Declined", sub: "Your defence against 1.d4", steps: [
    {t: "say", fen: "rnbqkbnr/ppp1pppp/8/3p4/2PP4/8/PP2PPPP/RNBQKBNR b KQkq - 0 2", orient: "b", text: "Against <b>1.d4</b> play <b>1...d5</b>, and against the Queen's Gambit, decline it with <b>2...e6</b>. You keep a strong pawn on d5 and develop calmly."},
    {t: "line", fen: START, user: "b", orient: "b", opening: "Queen's Gambit Declined", san: "d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6 Bh4 b6",
      notes: {1: "Meet d4 with d5.", 3: "Decline the gambit. d5 stays strong.", 5: "Develop.", 7: "Break the pin.", 9: "Castle early.", 11: "Ask the bishop a question.", 13: "The Tartakower setup: your bishop goes to b7."},
      text: "Play Black in the Queen's Gambit Declined.", okText: "A setup that has served World Champions for a century."}
  ]}
 ]},
 {id: "u6", title: "Tactics II", target: "1100 → 1300", desc: "Advanced weapons: deflection, attraction, removing the defender, sacrifices and mating nets.", lessons: [
  {id: "u6-deflect", title: "Deflection and Attraction", sub: "Lure pieces away or into traps", steps: [
    {t: "say", fen: START, text: "<b>Deflection</b> pulls a defender away from its job. <b>Attraction</b> lures a piece (often the king) onto a bad square, usually with a sacrifice."},
    {t: "puzzles", theme: "deflection", n: 4, range: [900, 1500], text: "Deflection puzzles."},
    {t: "puzzles", theme: "attraction", n: 3, range: [900, 1500], text: "Attraction puzzles."},
    {t: "story", ...STORIES.lasker, text: "Attraction taken to the extreme: the king is dragged across the whole board."}
  ]},
  {id: "u6-defender", title: "Remove the Defender", sub: "Capture the guard", steps: [
    {t: "say", fen: START, text: "If a piece is defended only once, <b>capture or chase away the defender</b>, then win the piece."},
    {t: "puzzles", theme: "capturingDefender", n: 4, range: [900, 1500], text: "Capture-the-defender puzzles."},
    {t: "puzzles", theme: "intermezzo", n: 3, range: [1000, 1600], text: "Bonus: the intermezzo, an in-between move."}
  ]},
  {id: "u6-sac", title: "Sacrifices", sub: "Give material to win more", steps: [
    {t: "say", fen: START, text: "A <b>sacrifice</b> gives up material on purpose for something bigger: checkmate, more material back, or a crushing attack."},
    {t: "story", ...STORIES.immortal, text: "The Immortal Game: Anderssen sacrifices both rooks and the queen, and still mates."},
    {t: "puzzles", theme: "sacrifice", n: 4, range: [1000, 1600], text: "Sacrifice puzzles."},
    {t: "puzzles", theme: "queenSac", n: 3, range: [1000, 1700], text: "Queen sacrifices."}
  ]},
  {id: "u6-mates", title: "Famous Mating Patterns", sub: "Smothered, Anastasia, Arabian, Boden", steps: [
    {t: "say", fen: "6rk/5Npp/8/8/8/8/8/6K1 b - - 0 1", orient: "w", text: "<b>Smothered mate</b>: the king is surrounded by its own pieces and a knight delivers mate."},
    {t: "drill", fen: "6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1", accept: {mate: true}, text: "Smothered mate in one.", okText: "Smothered!"},
    {t: "say", fen: "7k/7R/5N2/8/8/8/8/6K1 b - - 0 1", orient: "w", text: "<b>Arabian mate</b>: rook and knight team up in the corner. One of the oldest known patterns, already described over a thousand years ago."},
    {t: "puzzles", theme: "smotheredMate", n: 2, range: [800, 1800], text: "Smothered mates."},
    {t: "puzzles", theme: "anastasiaMate", n: 2, range: [800, 1800], text: "Anastasia's mate: knight and rook trap the king on the edge."},
    {t: "puzzles", theme: "matingNet", n: 3, range: [1000, 1700], text: "Mating nets: quiet moves that trap the king."}
  ]}
 ]},
 {id: "u7", title: "Endgames", target: "1300 → 1400", desc: "Win the won positions: king activity, opposition, pawn races and rook endings.", lessons: [
  {id: "u7-kp", title: "King and Pawn Endgames", sub: "Opposition and the square", steps: [
    {t: "say", fen: "8/8/8/4k3/8/4K3/4P3/8 w - - 0 1", text: "In the endgame, the <b>king becomes a fighter</b>. With king and pawn against king, put your king <b>in front of</b> the pawn."},
    {t: "say", fen: "8/3k4/8/3K4/3P4/8/8/8 w - - 0 1", text: "<b>Opposition</b>: kings face each other with one square between them. Whoever does NOT have to move holds the opposition. Here, with White to move it's a draw; with Black to move, White wins."},
    {t: "game", fen: "4k3/8/8/8/8/4K3/4P3/8 w - - 0 1", goal: "promote", limit: 20, depth: 10, text: "Win this king and pawn ending: promote the pawn. Lead with the king!", okText: "Promoted! You understood the opposition."},
    {t: "puzzles", theme: "opposition", n: 3, range: [700, 1600], text: "King moves in pawn endgames."},
    {t: "puzzles", theme: "pawnEndgame", n: 3, range: [900, 1500], text: "Pawn endgame puzzles."}
  ]},
  {id: "u7-rook", title: "Rook Endgames", sub: "The most common endgame", steps: [
    {t: "say", fen: "1K1k4/1P6/8/8/8/8/r7/2R5 w - - 0 1", text: "The <b>Lucena position</b>: the winning method is called 'building a bridge'. You'll bring the rook to the 4th rank to shield your king from checks.", fact: "Named after Luis Ramírez de Lucena, who wrote one of the first chess books in 1497. The position doesn't actually appear in his book!"},
    {t: "say", fen: "4k3/8/r7/3KP3/8/8/7R/8 b - - 0 1", orient: "w", text: "The <b>Philidor position</b> is the key defence: keep your rook on your 3rd rank until the pawn advances, then check from behind."},
    {t: "say", fen: START, text: "Golden rules: rooks belong <b>behind passed pawns</b>, activate your rook before grabbing pawns, and use your king."},
    {t: "puzzles", theme: "rookEndgame", n: 4, range: [900, 1600], text: "Rook endgame puzzles."}
  ]},
  {id: "u7-promo", title: "Promotion Tactics", sub: "Including underpromotion", steps: [
    {t: "say", fen: "8/8/8/8/8/8/8/8 w - - 0 1", text: "Passed pawns must be pushed! Sometimes promoting to a <b>knight</b> or <b>rook</b> is better than a queen, for example to give check or avoid stalemate. That's underpromotion."},
    {t: "puzzles", theme: "promotion", n: 3, range: [900, 1600], text: "Promotion puzzles."},
    {t: "puzzles", theme: "underPromotion", n: 2, range: [900, 2000], text: "Underpromotion: choose the right piece!"}
  ]}
 ]},
 {id: "u8", title: "Strategy", target: "1400 → 1500", desc: "What to do when there's no tactic: plans, pawn structure and piece activity.", lessons: [
  {id: "u8-activity", title: "Piece Activity", sub: "Good and bad pieces", steps: [

const PER_WORLD = 50;
const LOCK_SVG = `<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="sh" d="M7.5 11V8a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#1d1c1a" stroke-width="4.2" stroke-linecap="round"/><path class="sh" d="M7.5 11V8a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#EEEED2" stroke-width="2" stroke-linecap="round"/><rect x="4.5" y="10.5" width="15" height="11" rx="2.6" fill="#E9B64A" stroke="#1d1c1a" stroke-width="2"/><circle cx="12" cy="15.4" r="1.6" fill="#1d1c1a"/><path d="M12 16.4v2.2" stroke="#1d1c1a" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const QUESTS = {
  timed:   {icon: "⏱️", name: "Beat the Clock", short: "Timed"},
  lives:   {icon: "❤️", name: "Three Lives", short: "3 lives"},
  perfect: {icon: "💎", name: "Flawless", short: "Flawless"},
  mate:    {icon: "🎯", name: "Mate Hunt", short: "Mates"},

function worldIdx(L){ return Math.floor((L - 1) / PER_WORLD); }
function worldOf(L){ return WORLDS[worldIdx(L) % WORLDS.length]; }
function worldName(L){ const w = worldOf(L), c = Math.floor(worldIdx(L) / WORLDS.length); return w.name + (c ? " " + ["", "II", "III", "IV", "V", "VI"][Math.min(c, 5)] : ""); }
/* about four rating points per level: level 1 ≈ 450, level 290 ≈ 1600, level 640 ≈ 3000 */
function levelRating(L){ return Math.min(3000, 450 + 4 * (L - 1)); }
function pickBossBot(target){ let best = BOTS[0]; BOTS.forEach(b => { if (Math.abs(b.r - target) < Math.abs(best.r - target)) best = b; }); return best; }
function levelSpec(L){
  const r = levelRating(L), w = worldOf(L);
  if (L % PER_WORLD === 0){ const bot = pickBossBot(r + 100);
    return {L, type: "boss", world: true, r, bot, title: w.boss, goal: `Beat the world boss (${bot.name}, ${bot.r}) in a real game.`}; }
  if (L % 10 === 0){ const bot = pickBossBot(r - 150); return {L, type: "boss", r, bot, title: bot.name + " blocks the path", goal: `Win a game against ${bot.name} (${bot.r}).`}; }
  if (L % 5 === 0){
    const q = ["timed", "lives", "perfect", "mate"][((L / 5 - 1) / 2) % 4];
    if (q === "timed"){ const n = 4 + Math.min(4, Math.floor(L / 60)), secs = Math.max(75, 30 * n - Math.floor(L / 25) * 5); return {L, type: q, r: r - 150, n, secs, title: QUESTS[q].name, goal: `Solve ${n} puzzles in ${secs} seconds.`}; }
    if (q === "lives") return {L, type: q, r: r - 60, n: 6, title: QUESTS[q].name, goal: "Solve 6 puzzles. Three mistakes and you're out."};
    if (q === "perfect") return {L, type: q, r, n: 3, title: QUESTS[q].name, goal: "Solve 3 puzzles without a single mistake or hint."};
    return {L, type: q, r: r - 80, n: 3, theme: L < 120 ? "mateIn2" : "mateIn3plus", title: QUESTS[q].name, goal: `Find 3 checkmates (${L < 120 ? "mate in 2" : "mate in 3+"}).`};
  }
  const n = L <= 20 ? 1 : L <= 200 ? 2 : 3;

function jState(){ if (!S.journey) S.journey = {level: 1, best: {}}; if (!S.journey.best) S.journey.best = {}; return S.journey; }
function starsHTML(n, of = 3){ return `<span class="jstars">${Array.from({length: of}, (_, i) => `<i class="${i < n ? "on" : ""}">★</i>`).join("")}</span>`; }

  countdown(){

    const step = () => { if (!this.alive) return; n--; const el = $("#jcn"); if (!el) return;

    this.t = setTimeout(step, 800);
  },
  left(){ return this.sp.type === "timed" && this.st.t0 ? Math.max(0, this.sp.secs * 1000 - (Date.now() - this.st.t0)) : null; },
  tickClock(){ const l = this.left(); const el = $("#jclock"); if (el){ el.textContent = fmtSec(l); el.classList.toggle("low", l < 15000); } if (l <= 0 && !this.st.done) this.fail("Time's up."); },
  async next(){

/* record a finished level and unlock the next one */
function journeyComplete(L, stars){
  const J = jState(), before = J.level, prevBest = J.best[L] || 0;
  J.best[L] = Math.max(prevBest, stars); if (L >= J.level) J.level = L + 1;
  S.xp = (S.xp || 0) + 10 + 5 * Math.max(0, stars - prevBest); save();
  logEvent("journey", {level: L, stars, world: worldName(L), type: levelSpec(L).type});
  return {from: before, to: J.level, newWorld: worldIdx(J.level) > worldIdx(before)};
}
function journeyResultCard(board, sp, stars, res){
  const nl = res.to, nsp = levelSpec(nl);
  const ov = board.overlay(`<div class="card-over jdone"><div style="font-size:40px;line-height:1">${starsHTML(stars)}</div><h3>Level ${sp.L} complete!</h3>
    <p>${res.newWorld ? `New world unlocked: <b>${esc(worldName(nl))}</b> ✨` : nl > sp.L ? `Next up: level ${nl}${nsp.type === "boss" ? " · a boss game ⚔️" : QUESTS[nsp.type] ? " · " + QUESTS[nsp.type].name : ""}` : "Replay finished."}</p>
    <div class="grid2"><button class="btn" id="jagain">Replay</button><button class="btn go" id="jcont">Continue</button></div></div>`);
  const go = () => { clearTimeout(auto); App.go("journey", {anim: {from: Math.min(sp.L, res.from), to: res.to}}); };
  const auto = res.to > sp.L ? setTimeout(() => { if ($("#jcont")) go(); }, 2600) : null;
  if (auto) $("#jcont", ov).insertAdjacentHTML("beforeend", `<i class="jautobar"></i>`);
  $("#jcont", ov).onclick = go;
  $("#jagain", ov).onclick = () => { clearTimeout(auto); Views.journey.start(sp.L); };
}

/* ===== Game Review: Stockfish analysis with move classifications ===== */
const CLS = {
  brilliant:  {sym:"!!", name:"Brilliant",  c:"#1BACA6"},
  great:      {sym:"!",  name:"Great Move", c:"#5C8BB0"},
  best:       {sym:"★",  name:"Best",       c:"#81B64C"},
  excellent:  {sym:"👍", name:"Excellent",  c:"#81B64C"},
  good:       {sym:"✓",  name:"Good",       c:"#95B776"},
  book:       {sym:"📖", name:"Book",       c:"#A88865"},
  inaccuracy: {sym:"?!", name:"Inaccuracy", c:"#F7C631"},
  mistake:    {sym:"?",  name:"Mistake",    c:"#FFA459"},
  miss:       {sym:"✕",  name:"Miss",       c:"#FF7769"},
  blunder:    {sym:"??", name:"Blunder",    c:"#FA412D"},
};
const CLS_ORDER = ["brilliant","great","best","excellent","good","book","inaccuracy","mistake","miss","blunder"];
const winPct = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * clamp(cp, -1500, 1500))) - 1);
const accuracyFrom = losses => { if (!losses.length) return 100; const avg = losses.reduce((a, b) => a + b, 0) / losses.length; return clamp(103.1668 * Math.exp(-0.04354 * avg) - 3.1669, 0, 100); };
function fmtEval(v){ if (Math.abs(v) >= 9000){ const n = 10000 - Math.abs(v); return (v > 0 ? "M" : "-M") + n; } return (v > 0 ? "+" : "") + (v / 100).toFixed(1); }
function pieceValueAt(fen, sq){ const t = new Chess(fen); const p = t.get(sq); return p ? PV[p.type] : 0; }

    board.canPick = () => false;

    $("#topbar").innerHTML = `<span class="nm">${esc(this.A.me === "w" ? B : W)}</span>`; $("#botbar").innerHTML = `<span class="nm">${esc(this.A.me === "w" ? W : B)}</span>`;
    document.onkeydown = e => { if (e.key === "ArrowLeft") this.go(this.A.ply - 1); if (e.key === "ArrowRight") this.go(this.A.ply + 1); };

  async analyse(){

    Engine.init();
    if (Engine.failed){ this.panel("The analysis engine could not start in this browser."); return; }
    for (let i = 0; i < A.fens.length; i++){
      if (this.dead || this.A !== A) return;
      const fen = A.fens[i]; const tg = new Chess(fen);
      if (tg.game_over()){ A.evals[i] = tg.in_checkmate() ? (tg.turn() === "w" ? -10000 : 10000) : 0; A.lines[i] = []; }
      else { const r = await Engine.run({fen, depth: 11, multipv: 3}); if (!r){ A.evals[i] = A.evals[i - 1] || 0; A.lines[i] = []; } else { A.lines[i] = r.lines; A.evals[i] = Engine.white(r.lines[0], fen); A.lines[i].best = r.best; } }
      this.progress(i + 1, A.fens.length);
    }
    this.classify(); A.done = true; this.cache[key] = {evals: A.evals, lines: A.lines, cls: A.cls, sum: A.sum};
    this.saveSummary(); this.go(A.ply);
  },
  classify(){
    const A = this.A; const losses = {w: [], b: []}; const counts = {w: {}, b: {}};
    A.moves.forEach((m, i) => {
      const side = m.color, sg = side === "w" ? 1 : -1;
      const best = A.lines[i] && A.lines[i].best; const uci = m.from + m.to + (m.promotion || "");
      const LL = A.lines[i] || []; const hit = LL.findIndex(l => l && l.move === uci);
      const before = A.evals[i] * sg; const nextV = A.evals[i + 1] * sg; let after = hit >= 0 ? Math.min(sg * Engine.white(LL[hit], A.fens[i]), nextV) : nextV;
      if (hit < 0 && Math.abs(A.evals[i + 1]) >= 9000) after = A.evals[i + 1] * sg;
      const wpB = winPct(before), wpA = winPct(after); let loss = Math.max(0, wpB - wpA);
      if (uci === best && loss < 6) loss = 0;
      losses[side].push(loss);
      let c;
      if ((uci === best && loss < 6) || loss < 1) c = "best";
      else if (loss < 2.5) c = "excellent";
      else if (loss < 6) c = "good";
      else if (loss < 12) c = "inaccuracy";
      else if (loss < 22) c = "mistake";
      else c = "blunder";
      // book: early, sound moves
      if (i < 12 && loss < 10 && Math.abs(A.evals[i + 1]) < 150) c = "book";
      // great: the only good move
      const L = A.lines[i] || [];
      if ((c === "best") && L.length > 1 && L[1]){ const second = Engine.white(L[1], A.fens[i]) * sg; if (winPct(before) - winPct(second) >= 15 && wpA >= 40) c = "great"; }
      // brilliant: a sound piece sacrifice
      if ((c === "best" || c === "great" || c === "excellent") && m.piece !== "p" && m.piece !== "k"){
        const nextL = A.lines[i + 1]; const reply = nextL && nextL.best;
        const given = PV[m.piece] - (m.captured ? PV[m.captured] : 0);
        if (reply && reply.slice(2, 4) === m.to && given >= 200 && wpA >= 50) c = "brilliant";
      }
      // miss: opponent just erred and you failed to punish
      if (i > 0 && (c === "inaccuracy" || c === "mistake" || c === "blunder")){ const prev = A.cls[i - 1]; if (prev && (prev === "mistake" || prev === "blunder") && loss >= 10 && wpB >= 65) c = "miss"; }
      A.cls[i] = c; counts[side][c] = (counts[side][c] || 0) + 1;
    });
    A.sum = {accW: Math.round(accuracyFrom(losses.w) * 10) / 10, accB: Math.round(accuracyFrom(losses.b) * 10) / 10, counts};
  },
  saveSummary(){

    if (meta){ meta.review = {acc, counts: A.sum.counts[mine]}; save(); }
    const errs = A.moves.map((m, i) => ({m, i, c: A.cls[i]})).filter(x => x.m.color === mine && ["inaccuracy","mistake","blunder","miss"].includes(x.c)).map(x => ({ply: x.i + 1, played: x.m.san, cls: x.c, best: sanOf(A.fens[x.i], A.lines[x.i] && A.lines[x.i].best), fen: A.fens[x.i], evalBefore: A.evals[x.i], evalAfter: A.evals[x.i + 1]}));

  },
  progress(n, tot){ const el = $("#anprog"); if (el) el.style.width = Math.round(n / tot * 100) + "%"; const tx = $("#antext"); if (tx) tx.textContent = `Analyzing… ${n}/${tot}`; },
  go(ply){

    if (m && A.done && A.lines[ply - 1] && A.lines[ply - 1].best && A.lines[ply - 1].best !== m.from + m.to + (m.promotion || "") && ["inaccuracy","mistake","blunder","miss"].includes(A.cls[ply - 1])){ const b = A.lines[ply - 1].best; this.board.setArrows([[b.slice(0,2), b.slice(2,4), "g"]]); }
    const ev = A.evals[ply]; if (ev != null){ const w = winPct(ev); const bar = $("#evb i"); if (bar){ const pct = this.board.o === "w" ? w : 100 - w; bar.style.height = pct + "%"; } const et = $("#evt"); if (et) et.textContent = fmtEval(ev); }

  panel(errText){

    let top = "";
    if (errText) top = `<div class="msg no"><div class="ic">!</div><div><h4>Analysis unavailable</h4><p>${esc(errText)}</p></div></div>`;
    else if (!A.done) top = `<div class="msg"><div class="ic">⚙</div><div><h4 id="antext">Analyzing…</h4><div class="bar" style="margin-top:6px;width:220px"><i id="anprog" style="width:0%"></i></div></div></div>`;
    else {
      const s = A.sum, me = A.me; const row = side => CLS_ORDER.map(k => `<div class="li" style="padding:5px 4px"><span class="cls" style="background:${CLS[k].c}">${CLS[k].sym}</span><div class="grow"><div class="t" style="font-size:13.5px">${CLS[k].name}</div></div><b>${(s.counts.w[k] || 0)}</b><b style="width:28px;text-align:right">${(s.counts.b[k] || 0)}</b></div>`).join("");
      top = `<div class="grid2"><div class="stat"><span>White accuracy</span><b>${s.accW}</b></div><div class="stat"><span>Black accuracy</span><b>${s.accB}</b></div></div>
        ${this.keyMoments()}
        ${m && A.cls[ply - 1] ? this.explain(ply - 1) : `<div class="msg" style="margin-top:10px"><div class="ic">★</div><div><h4>Review ready</h4><p>Use the arrows or click a move. Your mistakes come with the better move shown in green.</p></div></div>`}
        <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-weight:800">Move quality table</summary><div class="list" style="margin-top:6px"><div class="li" style="padding:4px"><div class="grow"></div><span class="dim" style="font-size:12px">White</span><span class="dim" style="font-size:12px;width:34px;text-align:right">Black</span></div>${row()}</div></details>`;
    }
    let mv = ""; for (let i = 0; i < A.moves.length; i += 2){ const n = i / 2 + 1;
      const cell = j => { if (!A.moves[j]) return `<span></span>`; const c = A.cls[j]; const k = c ? CLS[c] : null; return `<span class="m ${A.ply === j + 1 ? "cur" : ""}" data-ply="${j + 1}">${k && ["brilliant","great","inaccuracy","mistake","miss","blunder"].includes(c) ? `<span class="cls" style="background:${k.c};width:16px;height:16px;font-size:9px;margin-right:4px">${k.sym}</span>` : ""}${esc(A.moves[j].san)}</span>`; };
      mv += `<span class="n">${n}.</span>${cell(i)}${cell(i + 1)}`; }
    $("#sp").innerHTML = top + `<div class="h-sec">Moves</div><div class="moves">${mv}</div>`;
    $$("#sp .m[data-ply]").forEach(s => s.onclick = () => this.go(+s.dataset.ply));
    $$("#sp [data-km]").forEach(s => s.onclick = () => this.go(+s.dataset.km));
    $("#sf").innerHTML = `<button class="btn" id="rvb">Games</button><button class="btn" id="r0">«</button><button class="btn" id="rp">‹</button><button class="btn" id="rn">›</button><button class="btn" id="re">»</button><button class="btn" id="ran">Analyze</button>${A.done ? `<button class="btn go" id="rlearn" style="flex:1">Retry mistakes</button>` : ""}`;
    $("#rvb").onclick = () => { this.dead = true; Engine.clear(); this.list(); };
    $("#r0").onclick = () => this.go(0); $("#rp").onclick = () => this.go(A.ply - 1); $("#rn").onclick = () => this.go(A.ply + 1); $("#re").onclick = () => this.go(A.moves.length);
    if ($("#rlearn")) $("#rlearn").onclick = () => this.retry();
    $("#ran").onclick = () => App.go("analysis", {fen: A.fens[A.ply], orient: this.board.o});
  },
  keyMoments(){
    const A = this.A; const me = A.me;
    const km = A.moves.map((m, i) => ({m, i, c: A.cls[i]})).filter(x => x.m.color === me && ["blunder","mistake","miss","brilliant","great"].includes(x.c)).slice(0, 8);
    if (!km.length) return "";
    return `<div class="h-sec">Key moments</div><div class="list">${km.map(x => { const k = CLS[x.c]; const b = A.lines[x.i] && A.lines[x.i].best; const bs = ["blunder","mistake","miss"].includes(x.c) ? sanOf(A.fens[x.i], b) : ""; return `<div class="li" data-km="${x.i + 1}" style="cursor:pointer"><span class="cls" style="background:${k.c}">${k.sym}</span><div class="grow"><div class="t">${Math.ceil((x.i + 1) / 2)}${x.i % 2 ? "..." : "."} ${esc(x.m.san)} · ${k.name}</div>${bs ? `<div class="s">Better: ${esc(bs)}</div>` : ""}</div></div>`; }).join("")}</div>`;
  },
  explain(i){
    const A = this.A, m = A.moves[i], c = A.cls[i], k = CLS[c]; const best = A.lines[i] && A.lines[i].best; const bestSan = sanOf(A.fens[i], best);
    const ev = fmtEval(A.evals[i + 1]);
    const text = {brilliant: "A brilliant sacrifice!", great: "The only move that keeps the advantage.", best: "The engine's top choice.", excellent: "Almost as good as the best move.", good: "A decent move.", book: "A known opening move.", inaccuracy: "Not the most precise. " + (bestSan ? bestSan + " was better." : ""), mistake: "This costs you. " + (bestSan ? "Better was " + bestSan + "." : ""), miss: "Your opponent slipped and you missed the punishment. " + (bestSan ? bestSan + " would have won more." : ""), blunder: "A serious error. " + (bestSan ? "Best was " + bestSan + "." : "")}[c];
    return `<div class="msg" style="margin-top:10px"><span class="cls" style="background:${k.c};width:34px;height:34px;font-size:15px">${k.sym}</span><div><h4>${esc(m.san)} is ${k.name.toLowerCase().startsWith("great") ? "a great move" : (/^[aeiou]/i.test(k.name) ? "an " : "a ") + k.name.toLowerCase()}</h4><p>${esc(text)} Eval ${ev}.</p></div></div>`;
  },
  retry(){
    const A = this.A; const me = A.me;
    const spots = A.moves.map((m, i) => ({m, i})).filter(x => x.m.color === me && ["mistake","blunder","miss"].includes(A.cls[x.i]));
    if (!spots.length){ toast("No big mistakes to retry. Clean game!"); return; }
    let k = 0; const board = this.board;
    const show = () => {
      const s = spots[k]; if (!s){ toast("All mistakes retried!"); this.go(A.ply); return; }
      const t = new Chess(A.fens[s.i]); board.setOrientation(me); board.set(t, s.i ? {from: A.moves[s.i - 1].from, to: A.moves[s.i - 1].to} : null); board.badge(null); board.setArrows([]);
      board.canPick = sq => { const p = t.get(sq); return p && p.color === t.turn(); };
      board.dests = gameDests(t);
      $("#sp").innerHTML = `<div class="msg hint"><div class="ic">${k + 1}</div><div><h4>Find a better move</h4><p>You played ${esc(s.m.san)} here (${CLS[A.cls[s.i]].name}). ${sideToMoveText(t.turn())}.</p></div></div>`;
      $("#sf").innerHTML = `<button class="btn" id="rq">Back to review</button><button class="btn" id="rs">Show best</button><button class="btn go" id="rnx" style="flex:1">Skip</button>`;
      $("#rq").onclick = () => { board.canPick = () => false; this.go(A.ply); }; $("#rnx").onclick = () => { k++; show(); };
      $("#rs").onclick = () => { const b = A.lines[s.i].best; if (b) board.setArrows([[b.slice(0,2), b.slice(2,4), "g"]]); };
      board.onMove = async (f, to, pr) => {
        const mv = t.move({from: f, to, promotion: pr || "q"}); if (!mv) return; board.set(t, {from: f, to}); Sound.forMove(mv, t); board.canPick = () => false;
        const uci = f + to + (mv.promotion || ""); const best = A.lines[s.i].best;
        let good = uci === best;
        if (!good){ const r = await Engine.run({fen: t.fen(), depth: 10}); if (r && r.lines[0]){ const sg = me === "w" ? 1 : -1; const after = sg * Engine.white(r.lines[0], t.fen()); good = winPct(A.evals[s.i] * sg) - winPct(after) < 5; } }
        if (good){ Sound.right(); board.mark({[f]: "good", [to]: "good"}); $("#sp").insertAdjacentHTML("beforeend", `<div class="msg ok" style="margin-top:10px"><div class="ic">✓</div><div><h4>Much better!</h4><p>${esc(mv.san)} keeps you on track.</p></div></div>`); setTimeout(() => { k++; show(); }, 1300); }
        else { Sound.wrong(); board.mark({[to]: "bad"}); setTimeout(() => { t.undo(); board.set(t, null); board.mark({}); board.canPick = sq => { const p = t.get(sq); return p && p.color === t.turn(); }; }, 700); }
      };
    };
    show();
  }
};

Views.analysis = {
  mount(main, arg){
    this.main = main; this.dead = false;
    main.innerHTML = stageHTML();
    const fen = arg && arg.fen;
    this.start = fen || START; this.g = new Chess(this.start); this.redo = []; this.lines = []; this.depth = 0; this.req = 0;
    const board = this.board = makeBoard($("#bw"), {orientation: arg && arg.orient || "w", history: false});
    $("#bw").insertAdjacentHTML("beforeend", `<div class="evalbar" id="evb"><i style="height:50%"></i><span id="evt">0.0</span></div>`);
    board.canPick = sq => { const p = this.g.get(sq); return p && p.color === this.g.turn(); };
    board.dests = sq => gameDests(this.g)(sq);
    board.onMove = (f, t, pr) => { const m = this.g.move({from: f, to: t, promotion: pr || "q"}); if (!m) return; this.redo = []; Sound.forMove(m, this.g); this.update(); };
    $("#topbar").innerHTML = `<span class="pill">Analysis board</span>`; $("#botbar").innerHTML = ``;
    document.onkeydown = e => { if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return; if (e.key === "ArrowLeft") this.back(); if (e.key === "ArrowRight") this.fwd(); };
    if (arg && arg.pgn){ const t = new Chess(); if (t.load_pgn(arg.pgn, {sloppy: true})){ this.g = t; } }
    Engine.init(); this.update();
  },
  unmount(){ this.dead = true; Engine.clear(); document.onkeydown = null; },
  back(){ const m = this.g.undo(); if (m){ this.redo.push(m); this.update(); } },
  fwd(){ const m = this.redo.pop(); if (m){ this.g.move(m); Sound.forMove(m, this.g); this.update(); } },
  update(){
    this.board.set(this.g, lastMv(this.g)); this.board.setArrows([]); this.lines = []; this.panel();
    const id = ++this.req; const fen = this.g.fen();
    if (this.g.game_over()){ this.panel(); return; }
    Engine.clear();
    (async () => { for (const d of [8, 12, 15]){ const r = await Engine.run({fen, depth: d, multipv: 3}); if (this.dead || id !== this.req || !r) return; this.lines = r.lines; this.depth = d; this.board.setArrows(r.lines.slice(0, 2).map((l, i) => [l.move.slice(0,2), l.move.slice(2,4), i ? "b" : "g"])); this.panel(); } })();
  },
  panel(){
    const g = this.g, fen = g.fen(); const l0 = this.lines[0]; const ev = l0 ? Engine.white(l0, fen) : null;
    if (ev != null){ const w = winPct(ev); const bar = $("#evb i"); if (bar) bar.style.height = (this.board.o === "w" ? w : 100 - w) + "%"; const et = $("#evt"); if (et) et.textContent = fmtEval(ev); }
    const pvSan = l => { const t = new Chess(fen); const out = []; for (const u of l.pv.slice(0, 8)){ const m = t.move({from: u.slice(0,2), to: u.slice(2,4), promotion: u[4] || undefined}); if (!m) break; out.push(m.san); } return out.join(" "); };
    const h = g.history(); let mv = ""; for (let i = 0; i < h.length; i += 2) mv += `<span class="n">${i / 2 + 1}.</span><span class="m">${esc(h[i])}</span><span class="m">${h[i+1] ? esc(h[i+1]) : ""}</span>`;
    const status = g.in_checkmate() ? "Checkmate" : g.in_stalemate() ? "Stalemate" : g.in_draw() ? "Draw" : sideToMoveText(g.turn());
    $("#sp").innerHTML = `<div class="row" style="justify-content:space-between"><div style="font:900 20px var(--display)">${status}</div><span class="pill">${this.depth ? "Depth " + this.depth : "Thinking…"}</span></div>
      <div class="list" style="margin-top:8px">${this.lines.map(l => `<div class="li"><span class="pill" style="min-width:54px;justify-content:center;background:${Engine.white(l, fen) >= 0 ? "#EEE" : "#333"};color:${Engine.white(l, fen) >= 0 ? "#222" : "#EEE"}">${fmtEval(Engine.white(l, fen))}</span><div class="grow"><div class="t" style="white-space:normal;font-weight:600">${esc(pvSan(l))}</div></div></div>`).join("") || `<p class="dim">Engine lines appear here.</p>`}</div>
      <div class="h-sec">Moves</div><div class="moves">${mv || `<span></span><span class="dim">Make moves for both sides</span>`}</div>
      <div class="h-sec">Position</div><input type="text" id="afen" value="${esc(fen)}" style="width:100%;font:600 12px var(--mono)" aria-label="FEN">
      <div class="row" style="margin-top:6px"><button class="btn sm" id="aload">Load FEN</button><button class="btn sm" id="acopy">Copy FEN</button><button class="btn sm" id="apgn">Copy PGN</button></div>`;
    $("#aload").onclick = () => { const v = $("#afen").value.trim(); const t = new Chess(); if (!t.load(v)){ toast("That FEN isn't valid"); return; } this.g = t; this.redo = []; this.update(); };
    $("#acopy").onclick = () => navigator.clipboard.writeText(fen).then(() => toast("FEN copied")).catch(() => toast("Copy failed"));
    $("#apgn").onclick = () => navigator.clipboard.writeText(g.pgn()).then(() => toast("PGN copied")).catch(() => toast("Copy failed"));
    $("#sf").innerHTML = `<button class="btn" id="a0">Reset</button><button class="btn" id="afl" aria-label="Flip board">⇅</button><button class="btn" id="ab">‹</button><button class="btn" id="af">›</button><button class="btn go" id="abest" style="flex:1">Play best</button>`;
    $("#a0").onclick = () => { this.g = new Chess(this.start); this.redo = []; this.update(); };
    $("#afl").onclick = () => { this.board.flip(); this.panel(); };
    $("#ab").onclick = () => this.back(); $("#af").onclick = () => this.fwd();
    $("#abest").onclick = () => { const l = this.lines[0]; if (!l) return; const m = g.move({from: l.move.slice(0,2), to: l.move.slice(2,4), promotion: l.move[4] || undefined}); if (m){ this.redo = []; Sound.forMove(m, g); this.update(); } };
  }
};

/* ===== Play by link: correspondence games that work anywhere (moves travel in the URL hash) ===== */
const ARTIFACT_URL = location.origin + location.pathname;
const B62 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
function encMoves(ucis){ const g = new Chess(); let out = ""; for (const u of ucis){ const ms = g.moves({verbose: true}).map(m => m.from + m.to + (m.promotion || "")).sort(); const i = ms.indexOf(u); if (i < 0) break; out += B62[Math.floor(i / 62)] + B62[i % 62]; g.move({from: u.slice(0,2), to: u.slice(2,4), promotion: u[4] || undefined}); } return out; }
function decMoves(str){ const g = new Chess(); const ucis = []; for (let k = 0; k + 1 < str.length; k += 2){ const i = B62.indexOf(str[k]) * 62 + B62.indexOf(str[k + 1]); const ms = g.moves({verbose: true}).map(m => m.from + m.to + (m.promotion || "")).sort(); const u = ms[i]; if (!u) break; ucis.push(u); g.move({from: u.slice(0,2), to: u.slice(2,4), promotion: u[4] || undefined}); } return ucis; }
const asciiName = n => String(n || "").normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 12) || "Friend";
function parseLinkHash(h){ const m = String(h || "").replace(/^.*#/, "").match(/^m-([a-z0-9]{5})-([A-Za-z]{1,12})-([wb])-([0-9A-Za-z]*)$/); if (!m) return null; return {gid: m[1], from: m[2], creator: m[3], moves: decMoves(m[4])}; }

Views.linkgame = {
  mount(main, arg){ this.main = main; S.linkGames = S.linkGames || {}; if (arg && arg.gid && S.linkGames[arg.gid]){ this.load(arg.gid); } else if (arg && arg.hash){ this.open(parseLinkHash(arg.hash)); } else if (arg && arg.newColor){ this.create(arg.newColor); } else setTimeout(() => App.go("friend"), 0); },
  unmount(){},
  create(color){
    const gid = Math.random().toString(36).slice(2, 7).padEnd(5, "0");
    S.linkGames[gid] = {color: color === "r" ? (Math.random() < .5 ? "w" : "b") : color, creator: true, opp: "", moves: [], ts: Date.now()}; save();
    this.load(gid);
  },
  open(p){
    if (!p){ toast("That link isn't a Chess.nat game"); App.go("friend"); return; }
    let rec = S.linkGames[p.gid];
    if (!rec){ const g = new Chess(); p.moves.forEach(u => g.move({from: u.slice(0,2), to: u.slice(2,4), promotion: u[4] || undefined})); rec = S.linkGames[p.gid] = {color: g.turn(), creator: false, opp: p.from, moves: [], ts: Date.now()}; }
    if (!rec.opp || rec.opp === "Friend") rec.opp = p.from;
    if (p.moves.length >= (rec.moves || []).length && p.moves.slice(0, rec.moves.length).join(" ") === rec.moves.join(" ")) rec.moves = p.moves;
    else if (p.moves.length < rec.moves.length) toast("That's an older link. Showing the latest position.");
    rec.ts = Date.now(); save(); this.load(p.gid);
  },
  load(gid){
    this.gid = gid; const rec = S.linkGames[gid]; this.rec = rec;
    this.g = new Chess(); rec.moves.forEach(u => this.g.move({from: u.slice(0,2), to: u.slice(2,4), promotion: u[4] || undefined}));
    try { history.replaceState(null, "", "#" + this.hash()); } catch(e) {}
    this.main.innerHTML = stageHTML();
    const b = this.board = makeBoard($("#bw"), {orientation: rec.color});
    b.canPick = sq => { const p = this.g.get(sq); return !this.sent && !this.g.game_over() && !rec.result && p && p.color === rec.color && this.g.turn() === rec.color; };
    b.dests = sq => gameDests(this.g)(sq);
    b.onMove = (f, t, pr) => this.move(f, t, pr);
    this.sent = false; b.set(this.g, lastMv(this.g)); this.render();
  },
  hash(){ const r = this.rec; return "m-" + this.gid + "-" + asciiName(S.name) + "-" + (r.creator ? r.color : (r.color === "w" ? "b" : "w")) + "-" + encMoves(r.moves); },
  link(){ return ARTIFACT_URL + "#" + this.hash(); },
  move(f, t, pr){
    const m = this.g.move({from: f, to: t, promotion: pr || "q"}); if (!m) return;
    this.rec.moves.push(f + t + (m.promotion || "")); this.rec.ts = Date.now(); this.sent = false;
    this.board.set(this.g, {from: f, to: t}); Sound.forMove(m, this.g);
    if (this.g.game_over()) this.finish(this.g.in_checkmate() ? (this.g.turn() === "w" ? "0-1" : "1-0") : "1/2-1/2", this.g.in_checkmate() ? "by checkmate" : "draw");
    save(); try { history.replaceState(null, "", "#" + this.hash()); } catch(e) {}
    this.render();
  },
  finish(res, why){
    const r = this.rec; if (r.result) return; r.result = res; r.why = why; const opp = r.opp || "Friend";
    S.h2h = S.h2h || {}; const hh = S.h2h[opp] || (S.h2h[opp] = {w: 0, d: 0, l: 0}); const win = res !== "1/2-1/2" && ((res === "1-0") === (r.color === "w")); if (win) hh.w++; else if (res === "1/2-1/2") hh.d++; else hh.l++; hh.ts = Date.now();
    this.g.header("White", r.color === "w" ? S.name : opp, "Black", r.color === "b" ? S.name : opp, "Result", res, "Event", "Chess.nat link game");
    S.games.push({id: Date.now().toString(36), mode: "link", opp, color: r.color, result: res, why, pgn: this.g.pgn(), ts: Date.now(), moves: this.g.history().length}); dayTick("gm"); save();
    logEvent("game", {opponent: opp, mode: "link", color: r.color, result: res, why, pgn: this.g.pgn()});
    Sound.play(win ? "Victory" : res === "1/2-1/2" ? "GenericNotify" : "Defeat", .8);
  },
  render(){
    const r = this.rec, g = this.g, me = r.color, opp = r.opp || "your friend"; const myTurn = g.turn() === me; const over = r.result || g.game_over();
    if (!r.result && g.game_over()) this.finish(g.in_checkmate() ? (g.turn() === "w" ? "0-1" : "1-0") : "1/2-1/2", g.in_checkmate() ? "by checkmate" : "draw");
    const cap = capturedFrom(g);
    $("#topbar").innerHTML = `<div class="av" style="background:#5C8BB0;color:#fff">${esc((opp[0] || "?").toUpperCase())}</div><span class="nm">${esc(r.opp || "Friend")}</span>${capsHTML(me === "w" ? cap.byBlack : cap.byWhite, me, me === "w" ? -cap.diff : cap.diff)}`;
    $("#botbar").innerHTML = youBar(capsHTML(me === "w" ? cap.byWhite : cap.byBlack, me === "w" ? "b" : "w", me === "w" ? cap.diff : -cap.diff));
    const h = g.history(); let mv = ""; for (let i = 0; i < h.length; i += 2) mv += `<span class="n">${i / 2 + 1}.</span><span class="m">${esc(h[i])}</span><span class="m">${h[i+1] ? esc(h[i+1]) : ""}</span>`;
    const lastWasMine = h.length && (h.length % 2 === 1) === (me === "w");
    let top;
    if (over) top = `<div class="msg ok"><div class="ic">★</div><div><h4>${r.result === "1/2-1/2" ? "Draw" : ((r.result === "1-0") === (me === "w") ? "You won!" : esc(opp) + " won")}</h4><p>${esc(r.why || "")}. ${lastWasMine ? "Send the final link so your friend sees it too." : ""}</p></div></div>`;
    else if (myTurn) top = `<div class="msg"><div class="ic">${me === "w" ? "♔" : "♚"}</div><div><h4>Your move</h4><p>Make your move, then send the link to ${esc(opp)}.</p></div></div>`;
    else top = `<div class="msg ok"><div class="ic">✓</div><div><h4>Now send this link</h4><p>Paste it into WhatsApp or any chat. When ${esc(opp)} replies with a link, open it or paste it below.</p></div></div>`;
    const showLink = (!myTurn || over) && h.length > 0 || (r.creator && !h.length && me === "b");
    $("#sp").innerHTML = top + (showLink ? `<textarea id="lk" readonly rows="3" style="width:100%;margin-top:10px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:600 12px var(--mono);resize:none">${esc(this.link())}</textarea><button class="btn go wide" id="lkc" style="margin-top:6px">Copy link</button>` : "")
      + `<div class="h-sec">Got a reply?</div><form id="pf" class="row" style="flex-wrap:nowrap"><input type="text" id="pin" placeholder="Paste the link from your friend" style="flex:1;min-width:0"><button class="btn sm" type="submit">Open</button></form>`
      + `<div class="h-sec">Moves</div><div class="moves">${mv || `<span></span><span class="dim">No moves yet</span>`}</div>`
      + (r.creator && !h.length ? `<p class="muted" style="font-size:13px">You play ${me === "w" ? "White, so you start" : "Black. Send the link first, your friend starts"}.</p>` : "");
    if ($("#lkc")) $("#lkc").onclick = () => { const t = $("#lk"); navigator.clipboard.writeText(this.link()).then(() => { toast("Link copied. Send it to " + opp); this.sent = true; }).catch(() => { t.focus(); t.select(); toast("Press copy on your keyboard"); }); };
    if ($("#lk")) $("#lk").onfocus = e => e.target.select();
    $("#pf").onsubmit = e => { e.preventDefault(); const p = parseLinkHash($("#pin").value.trim()); if (!p){ toast("That doesn't look like a game link"); return; } if (p.gid !== this.gid){ this.open(p); return; } this.open(p); };
    $("#sf").innerHTML = `<button class="btn" id="lgb">Games</button><button class="btn" id="lgf" aria-label="Flip board">⇅</button>${BoardNav.html()}${!over ? `<button class="btn" id="lgr">Resign</button>` : `<button class="btn go" id="lgv" style="flex:1">Review</button>`}`;
    $("#lgb").onclick = () => App.go("friend"); $("#lgf").onclick = () => this.board.flip();
    if ($("#lgr")) $("#lgr").onclick = () => { const b = $("#lgr"); if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = "Sure?"; b.style.background = "var(--bad)"; return; } this.finish(me === "w" ? "0-1" : "1-0", "by resignation"); r.moves.push("resign"); r.moves.pop(); save(); this.render(); };
    if ($("#lgv")) $("#lgv").onclick = () => App.go("review", {pgn: this.g.pgn(), meta: S.games[S.games.length - 1]});
  }
};
