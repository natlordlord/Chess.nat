<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);padding-top:var(--sat);padding-bottom:var(--sab)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* home-screen app: behave like a native app (html.app-mode is set by pwa.js) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%} body{-webkit-tap-highlight-color:transparent}
html.app-mode,html.app-mode body{overscroll-behavior:none}
html.app-mode{touch-action:manipulation}
html.app-mode .nav,html.app-mode .btn,html.app-mode .tabbar,html.app-mode .tile,html.app-mode .sheet,html.app-mode .pbar,html.app-mode .board{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* iOS 26 blurs the top of a home-screen app ("scroll edge effect") unless a fixed, solid-coloured bar
   covers the top edge. This bar sits behind the status bar in the page colour, so iOS uses that colour instead. */
html.app-mode .edge-top{position:fixed;top:0;left:0;right:0;height:max(var(--sat),12px);background:var(--bg);z-index:95;pointer-events:none}
html.app-mode .rail{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.install-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h,0px) + env(safe-area-inset-bottom,0px) + 12px);z-index:90;width:min(440px,calc(100% - 24px));display:flex;align-items:center;gap:12px;background:var(--panel-3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.install-hint img{border-radius:9px;flex:none}
.install-hint .ih-t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13.5px;line-height:1.35}
.install-hint .ih-t span{color:var(--muted)}
.install-hint .ih-x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px;cursor:pointer}
/* Chess.nat — app shell: fixed nav rail left, board stage centre, side panel right. Single dark theme by choice. */
:root{
  --bg:#2B2926; --rail:#211F1C; --panel:#211F1C; --panel-2:#33302C; --panel-3:#3D3A35; --line:#3F3B36;
  --fg:#F4F2EE; --muted:#BAB5AC; --dim:#8C867C;
  --go:#7FB24A; --go-hi:#8FC458; --go-deep:#4F7A2A; --bad:#E2523E; --warn:#E9B64A; --info:#5AA3E0; --brill:#26C2A3; --great:#5C8BD6;
  --sq-l:#EEEED2; --sq-d:#769656; --hl:rgba(255,255,51,.45); --hl-sel:rgba(255,255,51,.55); --check:rgba(235,64,52,.75);
  --display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --rail-w:200px; --panel-w:380px; --bs:640px;
  color-scheme:dark;
}
body[data-board="brown"]{--sq-l:#F0D9B5;--sq-d:#B58863}
body[data-board="blue"]{--sq-l:#DEE3E6;--sq-d:#7A99B4}
body[data-board="slate"]{--sq-l:#D6D9CF;--sq-d:#5E7166}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--go-hi)}
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100%}

/* nav rail */
.rail{background:var(--rail);display:flex;flex-direction:column;gap:2px;padding:14px 8px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
  padding-left:max(8px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 14px;font:800 22px var(--display);letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.brand svg{width:26px;height:26px}
.brand b{color:var(--go-hi);font-weight:800}
.nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav svg{width:22px;height:22px;flex:0 0 auto}
.nav:hover{background:var(--panel-2)}
.nav.on{background:var(--panel-3)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px}
.rail .grow{flex:1}
.rail .mini{display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--muted);font-size:13px}
.rankchip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:var(--panel-2);margin:6px 2px 0;cursor:pointer;border:0;width:calc(100% - 4px);text-align:left}
.rankchip .em{width:30px;height:30px;flex:0 0 auto}
.rankchip .t{font-weight:800;font-size:13px;line-height:1.1}
.rankchip .s{font-size:12px;color:var(--muted)}
.rail .me{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;border-radius:6px;border:0;background:none;color:var(--fg);cursor:pointer;width:100%;text-align:left}
.rail .me:hover,.rail .me.on{background:var(--panel-2)}
.rail .me .av{position:relative;width:28px;height:28px;flex:0 0 auto;border-radius:4px;background:#e8e6e3;display:block}
.rail .me .av .pc{position:absolute;inset:2px;width:auto;height:auto;transform:none;background-size:contain;background-repeat:no-repeat;background-position:center}
.rail .me .av .dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--muted);border:2px solid var(--rail)}
.rail .me .nm{display:flex;flex-direction:column;min-width:0}
.rail .me .nm b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .me .nm small{font-size:11.5px;color:var(--go-hi);font-weight:700}
.rail .icons{display:flex;justify-content:space-between;padding:4px 6px 2px}
.rail .ib{position:relative;display:grid;place-items:center;width:36px;height:34px;border-radius:6px;border:0;background:none;color:var(--muted);cursor:pointer}
.rail .ib:hover,.rail .ib.on{background:var(--panel-2);color:var(--fg)}
.rail .ib .badge{position:absolute;top:1px;right:1px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:0 5px;line-height:15px}
.rail .mini{font-size:11.5px;padding:2px 10px 0}

/* main */
.main{min-width:0;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px 20px}
.stage{display:flex;gap:20px;align-items:flex-start;justify-content:center}
.boardcol{width:var(--bs);flex:0 0 auto;display:flex;flex-direction:column;gap:6px;max-width:100%}
.side{width:var(--panel-w);flex:0 0 auto;background:var(--panel);border-radius:8px;display:flex;flex-direction:column;min-height:calc(var(--bs) + 84px);max-height:calc(var(--bs) + 84px);overflow:hidden}
.side .scroll{overflow-y:auto;flex:1;padding:16px}
.side .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.page{max-width:1100px;margin:0 auto}

/* player bars */
.pbar{display:flex;align-items:center;gap:10px;height:36px}
.pbar .av{width:34px;height:34px;border-radius:4px;background:var(--panel-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--muted);overflow:hidden}
.pbar .av svg{width:100%;height:100%}
.pbar .nm{font-weight:700;font-size:15px}
.pbar .rt{color:var(--muted);font-size:14px;margin-left:4px}
.pbar .caps{display:flex;align-items:center;gap:0;margin-left:4px;height:18px}
.pbar .caps i{width:16px;height:16px;background-size:100% 100%;display:inline-block;margin-right:-5px}
.pbar .adv{font-size:12px;color:var(--muted);margin-left:8px}
.pbar{height:48px}
.pbar .who{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px;line-height:1.15}
.pbar .who .l1{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}
.pbar .who .l1 .nm{overflow:hidden;text-overflow:ellipsis}
.pbar .who .l1 .rt{margin-left:0}
.pbar .who .l2{display:flex;align-items:center;height:16px;min-height:16px}
.pbar .who .l2 .caps{margin-left:0}
.pbar .av{width:40px;height:40px;flex:0 0 auto}
.clock{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px}
.clock.run::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box;background:conic-gradient(currentColor 0 25%,transparent 0);opacity:.85}
.clock{margin-left:auto;min-width:110px;text-align:right;font:700 22px var(--mono);padding:2px 10px;border-radius:4px;background:#1B1A18;color:#8F8B84;font-variant-numeric:tabular-nums}
.clock.run{background:#FFFFFF;color:#262421}
.clock.low{background:#E2523E;color:#fff}

/* board */
.boardwrap{position:relative;width:var(--bs);height:var(--bs);max-width:100%}
.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:3px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;container-type:inline-size}
.sq{position:relative}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq .hl{position:absolute;inset:0;pointer-events:none}
.sq.last .hl,.sq.sel .hl{background:var(--hl)}
.sq.sel .hl{background:var(--hl-sel)}
.sq.chk .hl{background:radial-gradient(circle,var(--check) 0%,rgba(235,64,52,.35) 55%,transparent 75%)}
.sq.good .hl{background:rgba(127,178,74,.6)}
.sq.bad .hl{background:rgba(226,82,62,.6)}
.sq.hint .hl{box-shadow:inset 0 0 0 .6cqw #F2C14E}
.sq.mark .hl{background:rgba(90,163,224,.45)}
.sq.thr .hl{box-shadow:inset 0 0 0 .55cqw rgba(226,62,48,.95);background:rgba(226,62,48,.18)}
.sq.tgt .hl{box-shadow:inset 0 0 0 .55cqw rgba(110,190,60,.95)}
.sq .dot{position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.14);pointer-events:none}
.sq .cap{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 .75cqw rgba(0,0,0,.14);pointer-events:none}
.co{position:absolute;font:700 2.1cqw var(--body);pointer-events:none}
.co.r{left:3%;top:2%}.co.f{right:4%;bottom:1%}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background-size:100% 100%;background-repeat:no-repeat;z-index:2;cursor:grab;will-change:transform;pointer-events:none}
.pc.anim{transition:transform .16s ease-out}
.pc.lift{z-index:20;cursor:grabbing}
.pc.ghost{opacity:.35}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:15}
.fx{position:absolute;inset:0;pointer-events:none;z-index:30;display:flex;align-items:flex-start;justify-content:center}
.float{margin-top:38%;font:900 54px var(--display);color:var(--go-hi);text-shadow:0 2px 0 rgba(0,0,0,.45);animation:floatup 1.1s ease-out forwards}
.float.neg{color:var(--bad)}
@keyframes floatup{0%{opacity:0;transform:translateY(16px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.badge-mv{position:absolute;width:3.6cqw;height:3.6cqw;min-width:18px;min-height:18px;border-radius:50%;z-index:25;display:flex;align-items:center;justify-content:center;font:900 1.9cqw var(--body);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4);transform:translate(-35%,35%)}
.promo{position:absolute;z-index:40;display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.45);overflow:hidden}
.promo button{width:calc(var(--bs)/8);height:calc(var(--bs)/8);max-width:12.5vw;max-height:12.5vw;border:0;background-color:#fff;background-size:90% 90%;background-position:center;background-repeat:no-repeat;cursor:pointer}
.promo button:hover{background-color:#EEE}
.overlay{position:absolute;inset:0;z-index:35;background:rgba(20,19,17,.66);display:flex;align-items:center;justify-content:center}
.card-over{background:var(--panel);border-radius:10px;padding:22px 26px;width:min(340px,86%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card-over h3{margin:0 0 4px;font:900 26px var(--display)}
.card-over p{margin:0 0 14px;color:var(--muted)}
.evalbar{position:absolute;left:-22px;top:0;width:14px;height:100%;background:#403D39;border-radius:2px;overflow:hidden}
.evalbar i{position:absolute;left:0;right:0;bottom:0;background:#F4F2EE;transition:height .3s}
.evalbar span{position:absolute;left:0;right:0;font:800 8px var(--body);text-align:center;color:#403D39;bottom:2px}

/* UI atoms */
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.h-title{font:900 28px var(--display);letter-spacing:-.01em}
.h-sec{font:800 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer;background:var(--panel-3);color:var(--fg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.btn.go{background:var(--go);color:#fff;box-shadow:inset 0 -4px 0 var(--go-deep)}
.btn.big{padding:16px 20px;font-size:20px;width:100%}
.btn.wide{width:100%}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:focus-visible,.nav:focus-visible,.tile:focus-visible{outline:2px solid var(--go-hi);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:6px;padding:10px 12px}
.stat b{display:block;font:900 22px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--panel-3);color:var(--muted)}
.pill.go{background:rgba(127,178,74,.18);color:var(--go-hi)}
.pill.bad{background:rgba(226,82,62,.18);color:#F07B68}
.msg{display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border-radius:8px;padding:12px 14px}
.msg .ic{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 18px var(--display);background:var(--panel-3)}
.msg.ok .ic{background:var(--go);color:#fff}.msg.no .ic{background:var(--bad);color:#fff}.msg.hint .ic{background:var(--warn);color:#2A1E05}
.msg h4{margin:0;font:800 17px var(--display)}
.msg p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--panel);border-radius:10px;padding:16px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg);min-width:0}
.tile:hover{background:var(--panel-2)}
.tile h3{font:800 17px var(--display)}
.tile p{margin:0;color:var(--muted);font-size:13.5px}
.tile .ico{width:40px;height:40px}
.bar{height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:4px}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted)}
select,input[type=number],input[type=text],input[type=email],input[type=password]{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:600 14px var(--body)}
input[type=range]{accent-color:var(--go)}
label.chk{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.moves{display:grid;grid-template-columns:34px 1fr 1fr;font-size:14px;font-variant-numeric:tabular-nums}
.moves span{padding:3px 6px;border-radius:3px}
.moves .n{color:var(--dim)}
.moves .m{cursor:pointer;font-weight:700}
.moves .m:hover{background:var(--panel-3)}
.moves .m.cur{background:var(--panel-3)}

/* phones: the app is exactly one screen. Status bar on top, content in the middle (the only thing that scrolls),
   tab bar at the bottom. Nothing else moves, nothing is counted twice. */
@media (max-width:900px){
  :root{--tab-h:52px;padding:0}
  html{background:var(--rail)}
  /* iOS 26 bug (WebKit 301108): a home-screen app whose page is shorter than the screen gets a viewport
     that is short by the status bar, leaving a strip under the tab bar. The page is only fixed layers,
     so give it the screen's height. The min() cap keeps it from ever scrolling (WebKit 316008). */
  html.app-mode{min-height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)))}
  .app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;padding-top:var(--sat);background:var(--bg)}
  .main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .page{padding:12px max(14px,var(--sal)) 20px max(14px,var(--sar))}
  .stage,.app .stage{height:100%}
  .pbar{padding:0 max(10px,var(--sal)) 0 max(10px,var(--sar))}
  .pbar .pill{background:none;padding:0;font-size:15px;font-weight:800;color:var(--fg)}
  .tabbar{position:static;flex:none;height:calc(var(--tab-h) + var(--sab));padding:0 var(--sar) var(--sab) var(--sal)}
  .tabbar button{gap:2px;font-size:10.5px}
  .tabbar svg{width:24px;height:24px}
  .sheet .panelx{padding-bottom:calc(14px + var(--tab-h) + var(--sab))}
  .toast{bottom:calc(var(--tab-h) + var(--sab) + 12px)}
}

.fx-stars i:nth-child(odd){top:30%}.fx-stars i:nth-child(3n){top:60%}.fx-stars i:nth-child(4n){top:85%}.fx-stars i:nth-child(5n){top:12%}
@keyframes jfall{to{transform:translateY(5200px) translateX(40px)}}
@keyframes jrise{to{transform:translateY(-5200px) translateX(-30px)}}
@keyframes jtwinkle{0%,100%{opacity:.2}50%{opacity:1}}
/* level card */
.jcard-wrap{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;animation:pop .2s ease-out}
.jcard{background:var(--panel);border-radius:16px;padding:22px 24px;width:min(360px,100%);text-align:center;border:4px solid #1d1c1a;box-shadow:0 8px 0 #141312,0 18px 40px rgba(0,0,0,.5);animation:jcardin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes jcardin{from{transform:scale(.7) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.jbig .pc{position:relative;display:inline-block;width:64px;height:64px;transform:none}
.jcard h3{margin:4px 0;font:900 24px var(--display)}.jcard p{color:var(--muted);margin:0 0 14px}
.jbig{font-size:54px;line-height:1;margin-bottom:6px}.jbig.sm{font-size:34px;margin:0}
.jdone .jstars i{font-size:38px}
/* level play */
.jprog{display:flex;gap:6px;justify-content:center;margin-top:12px}
.jprog i{width:22px;height:10px;border-radius:5px;background:var(--panel-3)}.jprog i.on{background:var(--go)}
.jhearts{display:flex;justify-content:center;gap:6px;font-size:24px;margin-top:8px}.jhearts i{font-style:normal}.jhearts i.lost{filter:grayscale(1);opacity:.35}
.jclock{font:900 20px var(--mono);background:var(--panel-2);padding:2px 10px;border-radius:6px}.jclock.low{color:#fff;background:var(--bad)}
.jcount{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.jcount b{font:900 min(34vw,170px)/1 var(--display);color:#F3F3DC;-webkit-text-stroke:5px #4E7A2C;paint-order:stroke fill;text-shadow:0 8px 0 #3B5E20;animation:jcnt .8s cubic-bezier(.2,1.6,.4,1)}
.jcount b.go{color:#9BD35C}
@keyframes jcnt{0%{transform:scale(2.2);opacity:0}40%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.9}}
/* home tile */
.tile.jtile{position:relative;overflow:hidden;border:1px solid var(--go)}
.tile.jtile .jt-deco{position:absolute;right:14px;top:10px;font-size:26px;opacity:.35;filter:grayscale(.35)}
@media (max-width:720px){.jhead h1{font-size:22px}.jnode{width:52px;height:52px;font-size:18px}.jnode.boss{width:68px;height:68px}.jnode.world{width:82px;height:82px}}

<script>
/* ===== Speech text helpers (shared by the page and the voice build script) ===== */
const PIECE_WORD = {K: "king", Q: "queen", R: "rook", B: "bishop", N: "knight"};
function speechNorm(t){ return String(t || "").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/\s+/g, " ").trim(); }
function speechKey(t){ const s = speechNorm(t); let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
/* turn chess notation into words a voice can say naturally */
function speakable(t){
  let s = speechNorm(t);
  s = s.replace(/Chess\.nat/g, "Chess dot nat");
  s = s.replace(/O-O-O/g, "castles queenside").replace(/O-O/g, "castles");
  s = s.replace(/\b(\d+)\.\.\.\s?/g, "").replace(/\b(\d+)\.(?=\s?[a-hKQRBNO])/g, "");
  s = s.replace(/\b([KQRBN])([a-h]?[1-8]?)(x?)([a-h][1-8])(=?[QRBN])?([+#]?)/g, (m, p, dis, x, sq, pr, ck) => PIECE_WORD[p] + (x ? " takes " : " ") + sq[0].toUpperCase() + " " + sq[1] + (ck === "#" ? ", checkmate" : ck === "+" ? ", check" : ""));
  s = s.replace(/\b([a-h])x([a-h][1-8])([+#]?)/g, (m, f, sq, ck) => f.toUpperCase() + " takes " + sq[0].toUpperCase() + " " + sq[1] + (ck === "#" ? ", checkmate" : ck === "+" ? ", check" : ""));
  s = s.replace(/\b([a-h][1-8])-([a-h][1-8])\b/g, (m, a, b) => a[0].toUpperCase() + " " + a[1] + " to " + b[0].toUpperCase() + " " + b[1]);
  s = s.replace(/\b([a-h])([1-8])\b/g, (m, f, r) => f.toUpperCase() + " " + r);
  s = s.replace(/\.\.\./g, " ").replace(/\s→\s/g, " to ").replace(/·/g, ",");
  s = s.replace(/\b1\.e4\b/g, "E 4").replace(/ 1600/g, " sixteen hundred");
  s = s.replace(/\s+/g, " ").trim();
  return s.replace(/(^|[.!?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase());
}

/* ===== Core: helpers, state, persistence, sound, ratings ===== */
const Views = {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function toast(t, ms = 2200){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }

/* ---------- ranks: League-style tiers mapped to FIDE-like percentiles ---------- */
const TIERS = [
  {k:"iron",        name:"Iron",        lo:400,  top:100,   c1:"#8A8580", c2:"#4E4A46"},
  {k:"bronze",      name:"Bronze",      lo:1010, top:96.3,  c1:"#C98A5E", c2:"#7A4A2B"},
  {k:"silver",      name:"Silver",      lo:1316, top:80.5,  c1:"#D3DCE3", c2:"#7D8A95"},
  {k:"gold",        name:"Gold",        lo:1517, top:59.9,  c1:"#F2CC63", c2:"#A2741B"},
  {k:"platinum",    name:"Platinum",    lo:1713, top:36.6,  c1:"#7FE0D2", c2:"#2B8C82"},
  {k:"emerald",     name:"Emerald",     lo:1900, top:18.2,  c1:"#6EE09A", c2:"#1E8A4C"},
  {k:"diamond",     name:"Diamond",     lo:2153, top:4.7,   c1:"#A9BDFF", c2:"#4C63C9"},
  {k:"master",      name:"Master",      lo:2404, top:0.74,  c1:"#E0A3FF", c2:"#8A3FB8"},
  {k:"grandmaster", name:"Grandmaster", lo:2672, top:0.058, c1:"#FF8A7A", c2:"#B3261E"},
  {k:"challenger",  name:"Challenger",  lo:2782, top:0.017, c1:"#FFF0A8", c2:"#C9A227"},
];
const ROMAN = ["IV","III","II","I"];
function rankOf(r){
  let i = 0; for (let j = 0; j < TIERS.length; j++) if (r >= TIERS[j].lo) i = j;

    const m = R.g.move({from, to, promotion: promo || "q"});

    const ok = uci === exp || (R.g.in_checkmate());
    board.set(R.g, {from, to});
    if (ok){
      Sound.forMove(m, R.g); R.idx++;
      if (R.idx >= R.p.moves.length){ R.finish(); return; }

      setTimeout(() => { if (!R.p || R.done) return; R.playUci(R.p.moves[R.idx]); R.idx++; R.locked = false; if (R.idx >= R.p.moves.length) R.finish(); }, 380);

    const h = R.g.history({verbose: true}); const l = h[h.length - 1];

    else { board.setArrows([[exp.slice(0,2), exp.slice(2,4), "g"]]); }

  };

    if (R.done || !R.p) return;
    R.sol = true; const first = !R.failed; R.failed = true; R.locked = true;
    hooks.onSolutionStart && hooks.onSolutionStart(R, first);

      const u = R.p.moves[R.idx];
      board.setArrows([[u.slice(0,2), u.slice(2,4), R.g.turn() === R.user ? "g" : "r"]]);
      await sleep(550); if (!R.p) return;
      R.playUci(u); R.idx++; board.setArrows([]);
      await sleep(350);
    }
    R.finish();
  };

  R.elapsed = () => Date.now() - R.t0;

}
const THEME_LESSON = {fork: "u4-fork", pin: "u4-pin", skewer: "u4-skewer", discoveredAttack: "u4-discovered", doubleCheck: "u4-discovered", backRankMate: "u3-backrank", hangingPiece: "u2-hanging", mateIn1: "u1-check", earlyMate: "u3-scholar", attackingF2F7: "u3-scholar", deflection: "u6-deflect", attraction: "u6-deflect", capturingDefender: "u6-defender", intermezzo: "u6-defender", sacrifice: "u6-sac", queenSac: "u6-sac", smotheredMate: "u6-mates", anastasiaMate: "u6-mates", arabianMate: "u6-mates", matingNet: "u6-mates", pawnEndgame: "u7-kp", opposition: "u7-kp", rookEndgame: "u7-rook", promotion: "u7-promo", underPromotion: "u7-promo", opening: "u5-principles"};

function recordThemes(p, ok){ dayTick("pz"); p.th.forEach(i => { const k = PZ.themes[i][0]; const t = S.themes[k] || (S.themes[k] = {n:0, ok:0}); t.n++; if (ok) t.ok++; }); }

function addFailed(p){ if (!S.failed.some(a => a[0] === p.id)) S.failed.push(encodeP(p)); }

const CHEERS = [null, [["Nice!","nice"],["Good one!","good"]], [["Great!","great"],["Smooth!","smooth"]], [["Brilliant!","brilliant"],["Superb!","superb"]], [["Legendary!","legendary"],["Unstoppable!","unstoppable"],["Genius!","genius"]]];

/* ===== Engine: Stockfish 10 (GPL) running in a worker ===== */
const Engine = {w: null, ok: false, q: [], cur: null, failed: false,
  init(){
    if (this.w || this.failed) return;
    try { this.w = new Worker("engine/sf.js"); } catch(e) { this.failed = true; return; }
    this.w.onmessage = e => this.line(String(e.data));
    this.w.onerror = () => { this.failed = true; this.ok = false; if (this.cur){ this.cur.res(null); this.cur = null; } };
    this.w.postMessage("uci"); this.w.postMessage("isready");
  },
  line(l){
    if (l === "readyok"){ this.ok = true; this.pump(); return; }
    const c = this.cur; if (!c) return;
    if (l.startsWith("info") && l.includes(" pv ")){
      const mp = +(l.match(/ multipv (\d+)/) || [0, 1])[1]; const d = +(l.match(/ depth (\d+)/) || [0, 0])[1];
      const cp = l.match(/ score cp (-?\d+)/), mt = l.match(/ score mate (-?\d+)/); const pv = l.split(" pv ")[1].trim().split(" ");
      if (l.includes("lowerbound") || l.includes("upperbound")) return;
      c.lines[mp - 1] = {depth: d, cp: cp ? +cp[1] : null, mate: mt ? +mt[1] : null, pv, move: pv[0]};
    } else if (l.startsWith("bestmove")){
      const best = l.split(" ")[1]; clearTimeout(c.to); this.cur = null; c.res({best: best === "(none)" ? null : best, lines: c.lines.filter(Boolean)}); this.pump();
    }
  },
  pump(){
    if (this.cur || !this.ok || !this.q.length) return;
    const j = this.cur = this.q.shift(); j.lines = [];
    const w = this.w;
    w.postMessage("setoption name Skill Level value " + (j.skill == null ? 20 : j.skill));
    w.postMessage("setoption name MultiPV value " + (j.multipv || 1));
    w.postMessage("position fen " + j.fen);
    w.postMessage(j.movetime ? "go movetime " + j.movetime : "go depth " + (j.depth || 12));
    j.to = setTimeout(() => { if (this.cur === j){ w.postMessage("stop"); } }, (j.movetime || 0) + 15000);
  },
  run(job){ this.init(); if (this.failed) return Promise.resolve(null); return new Promise(res => { this.q.push(Object.assign({res}, job)); this.pump(); }); },
  clear(){ this.q.splice(0).forEach(j => j.res(null)); if (this.cur && this.w){ this.w.postMessage("stop"); } },
  /* score from White's point of view, in pawns-cp; mate mapped to ±(10000 - n) */
  white(line, fen){ if (!line) return 0; const stm = fen.split(" ")[1]; let v = line.mate != null ? (line.mate > 0 ? 10000 - line.mate : -10000 - line.mate) : line.cp; return stm === "w" ? v : -v; }
};

  return alpha;

  if (depth === 0) return q ? qsearch(g, alpha, beta, 3) : (g.turn() === "w" ? 1 : -1) * evalWhite(g);

/* which of `color`'s pieces can be won right now: attacked and undefended, or attacked by something cheaper */
function hangingFor(g, color){
  const opp = color === "w" ? "b" : "w"; const out = [];
  const asTurn = c => { const p = g.fen().split(" "); p[1] = c; p[3] = "-"; return p.join(" "); };
  const t = new Chess(asTurn(opp)); const caps = t.moves({verbose: true}).filter(m => m.captured);
  const bySq = {}; caps.forEach(m => { (bySq[m.to] = bySq[m.to] || []).push(PV[m.piece] || 0); });
  Object.keys(bySq).forEach(sq => { const p = g.get(sq); if (!p || p.color !== color || p.type === "k") return;
    const d = new Chess(asTurn(color)); d.remove(sq); d.put({type: "n", color: opp}, sq); const defended = d.moves({verbose: true}).some(m => m.to === sq);
    const minA = Math.min(...bySq[sq]); if (!defended || minA < PV[p.type]) out.push(sq); });
  return out;
}

function capturedFrom(g){

  g.board().forEach(row => row.forEach(p => { if (p && p.type !== "k") cnt[p.color][p.type]++; }));
  const lost = c => { const out = []; ["q","r","b","n","p"].forEach(t => { for (let i = cnt[c][t]; i < start[t]; i++) out.push(t); }); return out; };
  const mat = c => cnt[c].p + 3 * cnt[c].n + 3 * cnt[c].b + 5 * cnt[c].r + 9 * cnt[c].q;

    $("#lreset").onclick = () => this.step();
  },
  /* --- step: single interactive move with a goal --- */
  s_drill(s){
    let g = new Chess(s.fen); const user = g.turn(); this.board.setOrientation(s.orient || user); this.board.set(g, s.last || null); this.board.mark(s.marks || {}); this.board.setArrows(s.arrows || []);
    let tries = 0;
    this.board.canPick = sq => { const p = g.get(sq); return !this.state.ok && p && p.color === user; };
    this.board.dests = gameDests(g);
    const check = (m) => { const a = s.accept || {};
      if (a.uci) return a.uci.includes(m.from + m.to + (m.promotion || ""));
      if (a.to) return [].concat(a.to).includes(m.to) && (!a.piece || m.piece === a.piece);
      if (a.mate) return g.in_checkmate();
      if (a.check) return g.in_check();
      if (a.castle) return m.flags.includes("k") || m.flags.includes("q");
      if (a.capture) return !!m.captured && (!a.piece || m.captured === a.piece);
      if (a.escape) return true;
      if (a.promote) return !!m.promotion && (a.promote === true || m.promotion === a.promote);
      return true; };
    this.board.onMove = (f, t, pr) => {
      const m = g.move({from: f, to: t, promotion: pr || "q"}); if (!m) return;
      this.board.set(g, {from: f, to: t}); Sound.forMove(m, g);
      if (check(m)){ this.state.ok = true; this.board.mark({[f]: "good", [t]: "good"}); this.board.setArrows([]); Sound.right(); this.feedback("ok", s.okTitle || "Well done!", s.okText || ""); if (s.okText) Voice.say(s.okText); this.enableNext(); if (s.after) this.later(() => { const r = g.move(s.after); if (r){ this.board.set(g, {from: r.from, to: r.to}); Sound.forMove(r, g); } }, 700); }
      else { tries++; Sound.wrong(); this.board.mark({[t]: "bad"}); this.stars = Math.max(1, this.stars - (tries === 1 ? 1 : 0)); const why = s.why && s.why[m.from + m.to]; this.feedback(why && why.ok ? "hint" : "no", why && why.ok ? "Good idea, but…" : "Not this one", why ? (why.text || why) : (tries >= 2 && s.hint ? s.hint : s.noText || "Try a different move.")); if (tries >= 2 && s.hintSq) this.later(() => this.board.mark({[s.hintSq]: "hint"}), 750); this.later(() => { g.undo(); this.board.set(g, s.last || null); this.board.mark(s.marks || {}); }, 700); }
    };
    this.panel(s, ``, {next: false, extra: s.hint ? `<button class="btn" id="lhint">Hint</button>` : ""});
    if (s.hint) $("#lhint").onclick = () => { this.feedback("hint", "Hint", s.hint); if (s.hintSq) this.board.mark({[s.hintSq]: "hint"}); };
  },
  /* --- step: scripted line (combinations and opening drills) --- */
  s_line(s){
    if (!s.line && s.san){ const t0 = new Chess(s.fen); s.line = s.san.split(/\s+/).filter(x => x && !/^\d+\.+$/.test(x)).map(x => { const m = t0.move(x); return m ? m.from + m.to + (m.promotion || "") : ""; }); }
    const g = new Chess(s.fen); const user = s.user || g.turn(); this.board.setOrientation(s.orient || user); this.board.set(g, s.last || null); this.board.setArrows([]); this.board.mark({});
    let idx = 0; let locked = false;
    const note = () => { const n = s.notes && s.notes[idx - 1]; if (n){ this.feedback("hint", (s.opening ? "" : "Good. ") + sanAt(), n); if (s.opening && S.settings.voice) Voice.say(n); } };
    const sanAt = () => { const h = g.history(); return h.length ? Math.ceil(h.length / 2) + (h.length % 2 ? ". " : "... ") + h[h.length - 1] : ""; };
    const oppMove = () => { const u = s.line[idx]; if (!u) return; const r = g.move({from: u.slice(0,2), to: u.slice(2,4), promotion: u[4] || undefined}); if (r){ this.board.set(g, {from: r.from, to: r.to}); Sound.forMove(r, g); } idx++; note(); locked = false; if (idx >= s.line.length) done(); };
    const done = () => { this.state.ok = true; Sound.right(); this.feedback("ok", s.okTitle || "Excellent!", s.okText || ""); if (s.okText) Voice.say(s.okText); this.enableNext(); };
    this.board.canPick = sq => { const p = g.get(sq); return !locked && !this.state.ok && p && p.color === user && g.turn() === user; };
    this.board.dests = gameDests(g);
    this.board.onMove = (f, t, pr) => {
      const exp = s.line[idx]; const m = g.move({from: f, to: t, promotion: pr || "q"}); if (!m) return;
      this.board.set(g, {from: f, to: t});
      const ok = f + t + (m.promotion || "") === exp || (g.in_checkmate() && s.anyMate !== false);
      if (!ok){ Sound.wrong(); this.board.mark({[t]: "bad"}); this.stars = Math.max(1, this.stars - 1); this.feedback("no", "Not quite", s.opening ? "That's playable, but this repertoire continues differently. Try again or press Show." : (s.hint || "Look for a forcing move: checks, captures, threats.")); locked = true; this.later(() => { g.undo(); const h = g.history({verbose: true}); const l = h[h.length - 1]; this.board.set(g, l ? {from: l.from, to: l.to} : (s.last || null)); this.board.mark({}); locked = false; }, 700); return; }
      Sound.forMove(m, g); idx++; this.board.mark({}); this.board.setArrows([]);
      if (idx >= s.line.length || (g.in_checkmate() && !s.opening)){ this.board.mark({[f]: "good", [t]: "good"}); note(); done(); return; }
      note(); locked = true; this.later(oppMove, s.opening ? 700 : 600);
    };
    this.panel(s, s.opening ? `<div class="pill">${esc(s.opening)}</div>` : ``, {next: false, extra: `<button class="btn" id="lhint">Hint</button><button class="btn" id="lshow">Show</button>`});
    $("#lhint").onclick = () => { const u = s.line[idx]; if (u) this.board.mark({[u.slice(0,2)]: "hint"}); if (!s.opening) this.stars = Math.max(1, this.stars - 1); };
    $("#lshow").onclick = () => { const u = s.line[idx]; if (u) this.board.setArrows([[u.slice(0,2), u.slice(2,4), "g"]]); if (!s.opening) this.stars = 1; };
    if (g.turn() !== user){ locked = true; this.later(oppMove, 700); }
  },
  /* --- step: puzzles from the database --- */
  s_puzzles(s){
    const n = s.n || 3; let solved = 0, seen = new Set();
    const R = PuzzleRunner(this.board, {
      onReady: () => { this.feedback("hint", `Puzzle ${Math.min(solved + 1, n)} of ${n}`, sideToMoveText(R.user) + ". " + (s.prompt || "Find the best move.")); },
      onWrong: (R2, first) => { if (first){ recordThemes(R2.p, false); addFailed(R2.p); logPuzzle("lesson", R2, false); } this.feedback("no", "Incorrect", "Try again. Use the hint if you're stuck."); },
      onSolved: (R2, clean) => { if (clean){ recordThemes(R2.p, true); logPuzzle("lesson", R2, true); } solved++; save(); $("#lsc").textContent = `Solved ${solved} / ${n}`; if (solved >= n){ this.feedback("ok", "Set complete!", "Nice work."); this.enableNext(); } else this.later(nextP, 900); }
    });
    const lo = s.range ? s.range[0] : Math.max(400, S.puzzle.r - 300), hi = s.range ? s.range[1] : S.puzzle.r + 150;
    const nextP = async () => { const p = await PZ.pick({target: Math.round((lo + hi) / 2), spread: Math.round((hi - lo) / 2), theme: s.theme, lo, hi, exclude: new Set([...seen, ...S.seen.slice(-300)])}) || await PZ.pick({target: (lo + hi) / 2, spread: 400, theme: s.theme}); if (!p || this.dead) return; seen.add(p.id); R.start(p); };
    this.panel(s, `<div class="row"><span class="pill" id="lsc">Solved 0 / ${n}</span>${s.theme ? `<span class="pill">${esc(themeKeyLabel(s.theme))}</span>` : ""}</div>`, {next: false, extra: `<button class="btn" id="lhint">Hint</button>`});
    $("#lhint").onclick = () => R.showHint();
    this.unmountExtra = () => R.stop();
    whenPuzzles(nextP);
  },
  /* --- step: practice game from a position --- */
  s_game(s){
    let g = new Chess(s.fen); const user = s.user || g.turn(); this.board.setOrientation(user); this.board.set(g, null); this.board.setArrows([]); this.board.mark({});
    let busy = false, moves = 0, fails = this.gameFails || 0; const bot0 = s.bot ? BOTS.find(b => b.id === s.bot) : null;
    const bot = bot0 ? tunedBot(bot0, fails >= 1 ? "relaxed" : "normal") : null; let threats = S.settings.threats !== false;
    const goalMet = () => { if (s.goal === "mate") return g.in_checkmate() && g.turn() !== user; if (s.goal === "promote"){ const h = g.history({verbose: true}); return h.some(m => m.color === user && m.promotion); } if (s.goal === "draw") return g.in_draw() || g.in_stalemate(); if (s.goal === "win"){ return g.in_checkmate() && g.turn() !== user; } if (s.goal === "survive") return moves >= (s.limit || 10); return false; };
    const failed = () => { if (s.goal !== "draw" && (g.in_stalemate() || g.insufficient_material() || g.in_threefold_repetition())) return "That's a draw. " + (s.goal === "mate" ? "Watch out for stalemate: always leave the king a square." : ""); if (g.in_checkmate() && g.turn() === user) return "You got checkmated."; if (s.limit && moves >= s.limit && !goalMet() && s.goal !== "survive") return `You used ${s.limit} moves.`; if (s.goal === "promote"){ const lost = !g.board().some(r => r.some(p => p && p.color === user && p.type === "p")); if (lost && !goalMet()) return "Your pawn is gone."; } return null; };
    const showThreats = () => { if (!threats || busy || g.turn() !== user){ this.board.setThreats({}); return; } const th = {}; hangingFor(g, user).forEach(q => th[q] = "thr"); hangingFor(g, user === "w" ? "b" : "w").forEach(q => th[q] = "tgt"); this.board.setThreats(th); };
    this.board.canPick = sq => { const p = g.get(sq); return !busy && !this.state.ok && p && p.color === user && g.turn() === user; };
    this.board.dests = gameDests(g);
    const end = (ok, why) => { this.state.ok = ok; busy = true; this.board.setThreats({}); if (ok){ this.gameFails = 0; Sound.play("Victory", .7); this.feedback("ok", s.okTitle || "Goal reached!", s.okText || ""); if (s.okText) Voice.say(s.okText); this.enableNext(); } else { this.gameFails = fails + 1; Sound.play("Defeat", .6); this.stars = Math.max(1, this.stars - 1); this.feedback("no", "Not this time", why + (bot ? " Press Restart: the bot will play a bit more relaxed now." : " Press Restart and try again.")); $("#lskip") && ($("#lskip").hidden = false); } };
    const reply = async () => {
      busy = true; this.board.setThreats({}); await sleep(380); if (this.dead) return;
      let mv = null;
      if (bot) mv = await botChooseMove(g, bot);
      else { const r = await Engine.run({fen: g.fen(), depth: s.depth || 10}); if (r && r.best) mv = g.moves({verbose: true}).find(x => x.from + x.to + (x.promotion || "") === r.best); if (!mv) mv = jsBotMove(g, {kind: "search", depth: 2, q: true, noise: 0}); }
      if (this.dead || !mv) return; const r2 = g.move(mv); this.board.set(g, {from: r2.from, to: r2.to}); Sound.forMove(r2, g); busy = false;
      if (goalMet()){ end(true); return; } const fl2 = failed(); if (fl2 || g.game_over()){ end(false, fl2 || "Game over."); return; }
      showThreats();
    };
    this.board.onMove = async (f, t, pr) => {
      const m = g.move({from: f, to: t, promotion: pr || "q"}); if (!m) return; moves++;
      this.board.set(g, {from: f, to: t}); this.board.setArrows([]); Sound.forMove(m, g); $("#lsc").textContent = `Moves: ${moves}${s.limit ? " / " + s.limit : ""}`;
      if (goalMet()){ end(true); return; } const fl = failed(); if (fl || g.game_over()){ end(false, fl || "Game over."); return; }

    };

      <label class="chk" style="font-size:14px"><input type="checkbox" id="lthr" ${threats ? "checked" : ""}> Threat helper (red = yours in danger, green = free to take)</label>`,
      {next: false, extra: `<button class="btn" id="lreset">Restart</button><button class="btn" id="lgh">Hint</button><button class="btn" id="lgu">Undo</button><button class="btn" id="lskip" ${fails ? "" : "hidden"}>Skip</button>`});
    $("#lreset").onclick = () => this.step();
    $("#lthr").onchange = e => { threats = e.target.checked; S.settings.threats = threats; save(); showThreats(); };
    $("#lgh").onclick = async () => { if (busy || g.turn() !== user) return; this.stars = Math.max(1, this.stars - 1); const r = await Engine.run({fen: g.fen(), depth: 10}); if (r && r.best && !this.dead) this.board.setArrows([[r.best.slice(0,2), r.best.slice(2,4), "g"]]); };

  /* --- step: legendary game with narration --- */
  s_story(s){

  },
