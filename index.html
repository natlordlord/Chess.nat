Views.local = {
  mount(main){ this.main = main; this.cfg = this.cfg || {tc: [10, 0], flip: true, white: S.name !== "You" ? S.name : "Player 1", black: "Player 2"}; this.menu(); },
  unmount(){ clearInterval(this.t); document.onkeydown = null; },
  menu(){
    clearInterval(this.t); const c = this.cfg;
    this.main.innerHTML = `<div class="page" style="max-width:640px"><button class="btn ghost sm" id="lb">← Play a Friend</button><h1 class="h-title" style="margin-top:6px">Play on this device</h1><p class="muted">Sit together and take turns on one screen.</p>
      <div class="unit" style="margin-top:12px"><h3>Players</h3><div class="grid2" style="margin-top:8px"><label class="muted">White<input type="text" id="pw" maxlength="20" value="${esc(c.white)}" style="width:100%;margin-top:4px"></label><label class="muted">Black<input type="text" id="pb" maxlength="20" value="${esc(c.black)}" style="width:100%;margin-top:4px"></label></div><button class="btn sm" id="sw" style="margin-top:8px">⇄ Swap colours</button></div>
      <div class="unit"><h3>Clock</h3><div class="grid3" style="margin-top:8px">${TIME_CONTROLS.map(tc => `<button class="btn sm ${c.tc[0] === tc[0] && c.tc[1] === tc[1] ? "go" : ""}" data-tc="${tc[0]},${tc[1]}">${tcLabel(tc)}</button>`).join("")}</div>
        <label class="chk"><input type="checkbox" id="fl" ${c.flip ? "checked" : ""}> Turn the board after every move</label>
        <button class="btn go big" id="go" style="margin-top:8px">Start</button></div></div>`;
    const read = () => { c.white = $("#pw").value.trim() || "White"; c.black = $("#pb").value.trim() || "Black"; c.flip = $("#fl").checked; };
    $("#lb").onclick = () => App.go("friend");
    $("#sw").onclick = () => { read(); [c.white, c.black] = [c.black, c.white]; this.menu(); };
    $$("[data-tc]", this.main).forEach(b => b.onclick = () => { read(); c.tc = b.dataset.tc.split(",").map(Number); this.menu(); });
    $("#go").onclick = () => { read(); this.start(); };
  },
  start(){
    const c = this.cfg; this.g = new Chess(); this.over = null; this.clk = c.tc[0] ? [c.tc[0] * 60000, c.tc[0] * 60000] : null; this.lastAt = Date.now();
    this.main.innerHTML = stageHTML();
    const b = this.board = makeBoard($("#bw"), {orientation: "w"});
    b.canPick = sq => { const p = this.g.get(sq); return !this.over && p && p.color === this.g.turn(); };
    b.dests = sq => gameDests(this.g)(sq);
    b.onMove = (f, t, pr) => this.move(f, t, pr);
    b.set(this.g, null); this.render();
    this.t = setInterval(() => this.tick(), 200);
  },
  move(f, t, pr){
    const m = this.g.move({from: f, to: t, promotion: pr || "q"}); if (!m) return;
    if (this.clk){ const i = m.color === "w" ? 0 : 1; if (this.g.history().length > 2) this.clk[i] = Math.max(0, this.clk[i] - (Date.now() - this.lastAt)); this.clk[i] += this.cfg.tc[1] * 1000; }
    this.lastAt = Date.now(); this.board.set(this.g, {from: f, to: t}); Sound.forMove(m, this.g);
    if (this.g.game_over()){ const g = this.g; this.end(g.in_checkmate() ? (g.turn() === "w" ? "0-1" : "1-0") : "1/2-1/2", g.in_checkmate() ? "by checkmate" : g.in_stalemate() ? "by stalemate" : g.in_threefold_repetition() ? "by repetition" : "by insufficient material"); return; }
    if (this.cfg.flip) setTimeout(() => { if (!this.over) this.board.setOrientation(this.g.turn()); this.render(); }, 450);
    this.render();
  },
  left(i){ if (!this.clk) return null; let v = this.clk[i]; const turn = this.g.turn() === "w" ? 0 : 1; if (!this.over && turn === i && this.g.history().length >= 2) v -= Date.now() - this.lastAt; return Math.max(0, v); },
  tick(){ if (!this.clk || this.over) return; ["w", "b"].forEach((c, i) => { const el = $("#lc" + c); if (el){ el.textContent = fmtClock(this.left(i)); const run = (this.g.turn() === c) && this.g.history().length >= 2; el.classList.toggle("run", run); el.classList.toggle("low", run && this.left(i) < 20000); } }); const turn = this.g.turn() === "w" ? 0 : 1; if (this.g.history().length >= 2 && this.left(turn) <= 0) this.end(turn === 0 ? "0-1" : "1-0", "on time"); },
  end(res, why){
    this.over = {res, why}; clearInterval(this.t); const c = this.cfg;
    this.g.header("White", c.white, "Black", c.black, "Result", res, "Event", "Chess.nat pass and play");
    const winner = res === "1-0" ? c.white : res === "0-1" ? c.black : null;
    S.games.push({id: Date.now().toString(36), mode: "local", opp: c.white + " vs " + c.black, color: "w", result: res, why, pgn: this.g.pgn(), ts: Date.now(), moves: this.g.history().length}); save();
    Sound.play(winner ? "Victory" : "GenericNotify", .8);
    const o = this.board.overlay(`<div class="card-over"><h3>${winner ? esc(winner) + " wins!" : "Draw"}</h3><p>${esc(why)}</p><div class="grid2"><button class="btn go" id="again">Rematch</button><button class="btn" id="rv">Review</button></div></div>`);
    $("#again", o).onclick = () => { [c.white, c.black] = [c.black, c.white]; this.start(); };
    $("#rv", o).onclick = () => App.go("review", {pgn: this.g.pgn(), meta: S.games[S.games.length - 1]});
    this.render();
  },
  render(){
    const c = this.cfg, o = this.board.o, top = o === "w" ? "b" : "w"; const cap = capturedFrom(this.g);
    const bar = col => `<div class="av" style="background:${col === "w" ? "#F4F2EE" : "#262421"};color:${col === "w" ? "#262421" : "#F4F2EE"}">${esc((col === "w" ? c.white : c.black)[0] || "?")}</div><span class="nm">${esc(col === "w" ? c.white : c.black)}</span>${capsHTML(col === "w" ? cap.byWhite : cap.byBlack, col === "w" ? "b" : "w", col === "w" ? cap.diff : -cap.diff)}${this.clk ? `<span class="clock" id="lc${col}">${fmtClock(this.left(col === "w" ? 0 : 1))}</span>` : ""}`;
    $("#topbar").innerHTML = bar(top); $("#botbar").innerHTML = bar(o);
    const h = this.g.history(); let mv = ""; for (let i = 0; i < h.length; i += 2) mv += `<span class="n">${i / 2 + 1}.</span><span class="m">${esc(h[i])}</span><span class="m">${h[i+1] ? esc(h[i+1]) : ""}</span>`;
    const turnName = this.g.turn() === "w" ? c.white : c.black;
    $("#sp").innerHTML = `<div class="msg ${this.over ? "ok" : ""}"><div class="ic">${this.g.turn() === "w" ? "♔" : "♚"}</div><div><h4>${this.over ? esc(this.over.res) + " " + esc(this.over.why) : esc(turnName) + " to move"}</h4><p>${tcLabel(c.tc)}</p></div></div><div class="h-sec">Moves</div><div class="moves">${mv || `<span></span><span class="dim">No moves yet</span>`}</div>`;
    $("#sf").innerHTML = `<button class="btn" id="lx">Setup</button><button class="btn" id="lf" aria-label="Flip board">⇅</button>${BoardNav.html()}${!this.over ? `<button class="btn" id="lu">Undo</button><button class="btn" id="ld">Draw</button><button class="btn" id="lr">${esc(turnName)} resigns</button>` : ""}`;
    $("#lx").onclick = () => this.menu(); $("#lf").onclick = () => { this.board.flip(); this.render(); };
    if ($("#lu")) $("#lu").onclick = () => { if (this.g.undo()){ this.lastAt = Date.now(); this.board.set(this.g, lastMv(this.g)); if (c.flip) this.board.setOrientation(this.g.turn()); this.render(); } };
    if ($("#ld")) $("#ld").onclick = () => this.end("1/2-1/2", "by agreement");
    if ($("#lr")) $("#lr").onclick = () => this.end(this.g.turn() === "w" ? "0-1" : "1-0", "by resignation");
  }
};

      <div class="unit"><h3>Puzzles</h3>${chk("autoNext", "Jump to the next puzzle after a correct solve")}</div>
      <div class="unit"><h3>Saving</h3><p class="muted" id="sv"></p><div class="row"><button class="btn sm" id="exp">Copy my data</button><button class="btn sm" id="rst">Reset everything</button></div></div>
      <div class="unit"><h3>Credits</h3><p class="muted" style="font-size:13px">Puzzles from the Lichess open database (CC0). Pieces "Staunty" by sadsnake1 (CC BY-NC-SA 4.0). Sounds made for Chess.nat. Analysis by Stockfish 10 (GPL). chess.js by Jeff Hlywa (BSD). Coach voice generated with Kokoro (Apache 2.0), voice "Heart". Accounts and live play by Supabase.</p></div></div>`;
    const sv = () => { $("#sv").textContent = Cloud.status === "on" ? "Your progress is saved to your Chess.nat account. It's private and follows you to every device where you're signed in." : Cloud.status === "viewonly" ? "Saving to your account was refused, so progress stays on this device. Try signing out and in again." : Cloud.status === "error" ? "Cloud sync has a problem (" + Cloud.lastError + "). Progress is still saved on this device." : "Progress is saved on this device only. Sign in under Account to sync it everywhere."; };
    sv();
    $$("[data-s]", main).forEach(c => c.onchange = () => { st[c.dataset.s] = c.checked; save(); if (c.dataset.s === "sound" && c.checked) Sound.play("Move"); });
    $$("[data-b]", main).forEach(b => b.onclick = () => { st.board = b.dataset.b; document.body.dataset.board = st.board; save(); this.mount(main); });
    $("#nm").onchange = e => { S.name = e.target.value.trim().slice(0, 24) || "You"; save(); renderRail(); };
    $$("[data-vr]", main).forEach(b => b.onclick = () => { st.voiceRate = +b.dataset.vr; save(); this.mount(main); Voice.say("Hi! I'm your chess coach. Let's get you to sixteen hundred."); });
    $("#tv").onclick = () => Voice.say("Hi! I'm your chess coach. Let's get you to sixteen hundred.");
    $("#exp").onclick = () => { const t = JSON.stringify(S); const show = () => { let ta = $("#expta"); if (!ta){ $("#exp").parentElement.insertAdjacentHTML("afterend", `<textarea id="expta" readonly rows="4" style="width:100%;margin-top:8px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:500 11px var(--mono)"></textarea><p class="muted" style="font-size:12.5px;margin:4px 0 0">Select all of it and copy, then paste it on the Chess.nat website under Account → Import.</p>`); ta = $("#expta"); } ta.value = t; ta.focus(); ta.select(); };
      navigator.clipboard.writeText(t).then(() => { toast("Copied. Paste it on the website under Account → Import."); }).catch(show); show(); };
    $("#rst").onclick = () => { const b = $("#rst"); if (b.dataset.armed){ S = DEF(); save(); App.go("home"); toast("Reset done"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to confirm"; } };
  }
};

/* ===== Boot ===== */
function boot(){
  document.body.dataset.board = S.settings.board || "green";
  const shell = document.createElement("div"); shell.className = "app"; shell.innerHTML = `<nav class="rail" id="rail" aria-label="Main"></nav><main class="main" id="main"></main><nav class="tabbar" id="tabbar" aria-label="Main"></nav><div class="sheet" id="sheet" hidden></div>`; document.body.appendChild(shell);
  sizeBoard();
  if (typeof Chess === "undefined"){ $("#main").innerHTML = `<div class="page"><div class="msg no"><div class="ic">!</div><div><h4>Chess engine library didn't load</h4><p>Check your connection and reload.</p></div></div></div>`; return; }
  loadPuzzles(); connectCloud(); Voice.load();
  const h = (location.hash || "").slice(1);
  if (h.startsWith("m-")) App.go("linkgame", {hash: h});
  else if (h.startsWith("g-") && Views.friend) App.go("friend", {join: h.slice(2)});
  else App.go(Views[h] && h !== "lesson" ? h : "home");
  window.addEventListener("hashchange", () => { const r = location.hash.slice(1); if (r !== App.route && Views[r] && r !== "lesson") App.go(r); if (r.startsWith("g-") && Views.friend && App.route !== "friend") App.go("friend", {join: r.slice(2)}); if (r.startsWith("m-")){ const p = parseLinkHash(r); const cur = App.route === "linkgame" && Views.linkgame.gid && p && p.gid === Views.linkgame.gid && p.moves.length === (Views.linkgame.rec.moves || []).length; if (!cur) App.go("linkgame", {hash: r}); } });
  document.addEventListener("pointerdown", () => Sound.init(), {once: true});
}

/* ===== Account page (website only) ===== */
Views.account = {
  async mount(main){
    const site = window.ChessSite || {}; const s = site.getSession ? (await site.sessionReady, site.getSession()) : null;
    if (!site.ready){ main.innerHTML = `<div class="page" style="max-width:520px"><h1 class="h-title">Account</h1><div class="msg no" style="margin-top:12px"><div class="ic">!</div><div><h4>Accounts aren't set up yet</h4><p>Add your Supabase URL and key in config.js (see README). Until then progress is saved on this device.</p></div></div></div>`; return; }
    if (s){
      main.innerHTML = `<div class="page" style="max-width:520px"><h1 class="h-title">Account</h1>
        <div class="unit" style="margin-top:12px"><div class="row" style="gap:12px">${emblem(rankOf(S.puzzle.r), 48)}<div><div style="font:900 20px var(--display)">${esc(S.name)}</div><div class="muted">${esc(s.user.email || "")}</div></div></div>
        <p class="muted" style="margin:10px 0 0">Your progress is saved to this account and follows you to every device where you sign in.</p></div>
        <button class="btn" id="out">Sign out</button></div>`;
      $("#out").onclick = () => site.signOut();
      return;
    }
    let mode = this.mode || "in";
    /* in the home-screen app, links from emails open in Safari (a separate login on iPhone), so sign in with the password here */
    const inApp = !!(window.ChessApp && window.ChessApp.isApp);
    const render = () => {
      main.innerHTML = `<div class="page" style="max-width:440px"><h1 class="h-title">${mode === "up" ? "Create account" : "Sign in"}</h1><p class="muted">Your rating, lessons and games are saved to your account and sync across devices.</p>
        <form class="unit" id="af" style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
          <label class="muted">Email<input type="email" id="em" required autocomplete="email" style="width:100%;margin-top:4px"></label>
          <label class="muted">Password<input type="password" id="pw" minlength="6" required autocomplete="${mode === "up" ? "new-password" : "current-password"}" style="width:100%;margin-top:4px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:600 14px var(--body)"></label>
          <p id="aerr" style="color:var(--bad);margin:0;font-size:13px"></p>
          <button class="btn go big" type="submit">${mode === "up" ? "Create account" : "Sign in"}</button>
          ${inApp ? "" : `<button class="btn" type="button" id="mg">Email me a sign-in link instead</button>`}
          ${window.CHESSNAT_CONFIG && window.CHESSNAT_CONFIG.google ? `<button class="btn" type="button" id="gg">Continue with Google</button>` : ""}
        </form>
        <p class="muted" style="text-align:center">${mode === "up" ? `Already have an account? <a href="#" id="sw">Sign in</a>` : `New here? <a href="#" id="sw">Create an account</a> · <a href="#" id="fg">Forgot password</a>`}</p>
        <p class="dim" style="text-align:center;font-size:12.5px">${inApp ? "On iPhone the app keeps its own progress, separate from Safari. Sign in with the same account in both and everything stays in sync." : "You can also keep playing without an account. Progress then stays on this device."}</p></div>`;
      const err = t => { $("#aerr").textContent = t || ""; };
      $("#sw").onclick = e => { e.preventDefault(); mode = this.mode = mode === "up" ? "in" : "up"; render(); };
      if ($("#fg")) $("#fg").onclick = async e => { e.preventDefault(); const em = $("#em").value.trim(); if (!em) return err("Enter your email first."); const r = await site.reset(em); err(r.error ? r.error.message : ""); if (!r.error) toast(inApp ? "Check your inbox. Set the new password there, then sign in here." : "Check your inbox for a reset link", inApp ? 4500 : 2200); };
      if ($("#mg")) $("#mg").onclick = async () => { const em = $("#em").value.trim(); if (!em) return err("Enter your email first."); const r = await site.magic(em); if (r.error) err(r.error.message); else { err(""); toast("Sign-in link sent. Check your inbox."); } };
      if ($("#gg")) $("#gg").onclick = () => site.google();
      $("#af").onsubmit = async e => { e.preventDefault(); err(""); const em = $("#em").value.trim(), pw = $("#pw").value;
        const r = mode === "up" ? await site.signUp(em, pw) : await site.signIn(em, pw);
        if (r.error){ const m = r.error.message || "";
          if (m === "Invalid login credentials") return err("Wrong email or password. Forgot it? Use “Forgot password” below.");
          if (m === "Email not confirmed") return err("Please click the confirmation link in your email first, then sign in here.");
          if (/rate limit|only request this after|too many/i.test(m)) return err("Too many emails in a short time. Wait a minute and try again.");
          return err(m); }
        if (mode === "up" && r.data && r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0){
          mode = this.mode = "in"; render(); $("#em").value = em; return $("#aerr").textContent = "This email already has an account. Sign in with your password."; }
        if (mode === "up" && !r.data.session){ err(""); $("#af").outerHTML = `<div class="msg ok" style="margin-top:12px"><div class="ic">✓</div><div><h4>Check your inbox</h4><p>We sent a confirmation link to ${esc(em)}. ${inApp ? "Open it, then come back to this app and sign in with your email and password." : "Open it on this device; you'll be signed in automatically."}</p></div></div>`; } };
    };
    render();
  }
};
function siteBanner(){
  const site = window.ChessSite; if (!site || !site.ready || site.getSession()) return "";
  return `<div class="unit" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--go)"><div style="flex:1;min-width:200px"><h3>Save your progress</h3><p class="muted" style="margin:2px 0 0">Create a free account so your rating, lessons and games follow you to every device.</p></div><button class="btn go" onclick="App.go('account')">Sign in</button></div>`;
}

boot();
</script>
</body>
</html>
