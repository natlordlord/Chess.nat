<p>Einen Moment … <a id="go" href="/#invite">Zum Film</a></p>
<script>
/* Alte Einladungslinks (/invite?ref=…): der Film läuft jetzt in der App selbst, unter /?ref=<handle>#invite */
(function(){ let r = ""; try { r = new URLSearchParams(location.search).get("ref") || ""; } catch(e) {}
  const to = "/" + (r && /^[a-z0-9_]{3,20}$/i.test(r) ? "?ref=" + encodeURIComponent(r.toLowerCase()) : "") + "#invite";
  document.getElementById("go").href = to; location.replace(to); })();
</script>
